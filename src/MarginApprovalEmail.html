<!-- ═══ MarginApprovalEmail.html — EMAIL BODY for a margin-change approval ═══
     This file is the HTML body sent to approvers (not a web page). It is rendered
     by sendMarginApprovalEmail_() via HtmlService.createTemplateFromFile, with:
       uniqueNo, userId, fieldsHtml (record 4-cell rows), compareHtml (old→new
       rows), link (the Approve URL). -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { margin: 0; padding: 0; background: #faf6f0; font-family: Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
      .wrap { padding: 16px; }
      .card { max-width: 680px; margin: 0 auto; background: #fff; border: 1px solid #ece2d5; border-radius: 14px; overflow: hidden; }
      .head { background: linear-gradient(135deg, #7b4019, #ff7d29); padding: 11px 22px; color: #fff4e8; }
      .head .ey { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.85; }
      .head h1 { font-size: 17px; font-weight: 700; margin: 2px 0 0; }
      .body { padding: 14px 22px; color: #241a12; }
      .intro { margin: 0 0 10px; font-size: 12.5px; line-height: 1.4; color: #5a4a3b; }
      .sec { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #9c8a76; margin: 13px 0 5px; }
      table.t, table.c { width: 100%; border-collapse: collapse; }
      table.t td, table.c td, table.c th { padding: 3px 9px; border: 1px solid #ece2d5; font-size: 11.5px; line-height: 1.2; color: #241a12; vertical-align: top; text-align: left; }
      table.t td.l, table.c td.l { background: #fff8ea; color: #5a4a3b; font-weight: 700; }
      table.t td.l { width: 20%; }
      table.t td.v { width: 30%; }
      table.c th { background: #fbefe0; color: #7a5a10; font-weight: 700; text-transform: uppercase; font-size: 10px; }
      table.c td.l { width: 34%; }
      table.c td.nv { font-weight: 700; }
      table.c tr.chg td.l { background: #fff8d6; color: #7a5a10; border-color: #e8cf6a; }
      table.c tr.chg td.nv { background: #fff8d6; color: #7a5a10; border-color: #e8cf6a; }
      .cta { text-align: center; margin: 20px 0 4px; }
      .btn { display: inline-block; background: #ff7d29; color: #fff; text-decoration: none; font-weight: 700; font-size: 14px; padding: 10px 30px; border-radius: 9px; }
      .foot { padding: 9px 22px; background: #fff8ea; border-top: 1px solid #ece2d5; font-size: 10px; color: #9c8a76; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="head">
          <div class="ey">Pageformat System</div>
          <h1>Margin change — approval needed</h1>
        </div>
        <div class="body">
          <p class="intro">A margin change was submitted for <b><?= uniqueNo ?></b> (<?= userId ?>). Please review and record your decision — approve or not approved.</p>
          <div class="sec">Record</div>
          <table class="t"><tbody><?!= fieldsHtml ?></tbody></table>
          <div class="sec">Margin change (old → new)</div>
          <table class="c">
            <thead><tr><th>Field</th><th>Old</th><th>New</th></tr></thead>
            <tbody><?!= compareHtml ?></tbody>
          </table>
          <div class="cta"><a href="<?= link ?>" class="btn" style="display:inline-block;background:#ff7d29;color:#ffffff;text-decoration:none;font-weight:700;font-size:14px;padding:10px 30px;border-radius:9px;">Review &amp; Respond</a></div>
        </div>
        <div class="foot">Automated message from Pageformat System — please do not reply.</div>
      </div>
    </div>
  </body>
</html>
