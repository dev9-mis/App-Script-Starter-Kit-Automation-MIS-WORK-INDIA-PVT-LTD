<script>
  /* ============================= DATE RANGE PICKER (Table Filter) ============================= */
  let drState = null;

  const DR_PRESETS = [
    {
      key: 'today',
      label: 'Today',
      fn: () => {
        const t = startOfDay(new Date());
        return [t, t];
      },
    },
    {
      key: 'yesterday',
      label: 'Yesterday',
      fn: () => {
        const d = new Date();
        d.setDate(d.getDate() - 1);
        const t = startOfDay(d);
        return [t, t];
      },
    },
    {
      key: 'tomorrow',
      label: 'Tomorrow',
      fn: () => {
        const d = new Date();
        d.setDate(d.getDate() + 1);
        const t = startOfDay(d);
        return [t, t];
      },
    },
    {
      key: 'thisWeek',
      label: 'This Week',
      fn: () => {
        const d = new Date();
        const s = new Date(d);
        s.setDate(d.getDate() - d.getDay());
        return [startOfDay(s), startOfDay(d)];
      },
    },
    {
      key: 'lastWeek',
      label: 'Last Week',
      fn: () => {
        const d = new Date();
        const e = new Date(d);
        e.setDate(d.getDate() - d.getDay() - 1);
        const s = new Date(e);
        s.setDate(e.getDate() - 6);
        return [startOfDay(s), startOfDay(e)];
      },
    },
    {
      key: 'last7',
      label: 'Last 7 Days',
      fn: () => {
        const d = new Date();
        const s = new Date(d);
        s.setDate(d.getDate() - 6);
        return [startOfDay(s), startOfDay(d)];
      },
    },
    {
      key: 'last30',
      label: 'Last 30 Days',
      fn: () => {
        const d = new Date();
        const s = new Date(d);
        s.setDate(d.getDate() - 29);
        return [startOfDay(s), startOfDay(d)];
      },
    },
    {
      key: 'thisMonth',
      label: 'This Month',
      fn: () => {
        const d = new Date();
        return [startOfDay(new Date(d.getFullYear(), d.getMonth(), 1)), startOfDay(d)];
      },
    },
    {
      key: 'lastMonth',
      label: 'Last Month',
      fn: () => {
        const d = new Date();
        const e = new Date(d.getFullYear(), d.getMonth(), 0);
        const s = new Date(e.getFullYear(), e.getMonth(), 1);
        return [startOfDay(s), startOfDay(e)];
      },
    },
  ];
  function startOfDay(d) {
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }
  function fmtDR(d) {
    if (!d) return '';
    const p = (n) => String(n).padStart(2, '0');
    const M = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return `${p(d.getDate())}-${M[d.getMonth()]}-${d.getFullYear()}`;
  }
  function fmtISO(d) {
    if (!d) return '';
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function openDateRange(tableKey, colKey) {
    const st = S.dt[tableKey];
    const existing = st.dateFilters && st.dateFilters[colKey];
    const from = existing && existing.from ? new Date(existing.from + 'T00:00:00') : null;
    const to = existing && existing.to ? new Date(existing.to + 'T00:00:00') : null;
    const m1 = from || new Date();
    drState = {
      table: tableKey,
      col: colKey,
      from,
      to,
      month1: new Date(m1.getFullYear(), m1.getMonth(), 1),
      selecting: null,
      presetKey: null,
    };
    renderDateRangePopup();
  }
  function closeDateRange() {
    drState = null;
    const el = document.getElementById('drPopup');
    if (el) el.remove();
  }
  function applyDateRange() {
    if (!drState) return;
    const st = S.dt[drState.table];
    if (!st.dateFilters) st.dateFilters = {};
    if (drState.from || drState.to) {
      st.dateFilters[drState.col] = { from: fmtISO(drState.from), to: fmtISO(drState.to) };
    } else {
      delete st.dateFilters[drState.col];
    }
    st.page = 1;
    closeDateRange();
    render();
  }
  function clearDateRange() {
    if (!drState) return;
    const st = S.dt[drState.table];
    if (st.dateFilters) delete st.dateFilters[drState.col];
    st.page = 1;
    closeDateRange();
    render();
  }
  function drSelectDay(d) {
    if (!drState) return;
    if (!drState.from || drState.to) {
      drState.from = d;
      drState.to = null;
      drState.presetKey = null;
    } else {
      if (d < drState.from) {
        drState.to = drState.from;
        drState.from = d;
      } else drState.to = d;
      drState.presetKey = null;
    }
    renderDateRangePopup();
  }
  function drSelectPreset(key) {
    const p = DR_PRESETS.find((x) => x.key === key);
    if (!p || !drState) return;
    const [f, t] = p.fn();
    drState.from = f;
    drState.to = t;
    drState.presetKey = key;
    drState.month1 = new Date(f.getFullYear(), f.getMonth(), 1);
    renderDateRangePopup();
  }
  function drPrevMonth() {
    if (!drState) return;
    drState.month1.setMonth(drState.month1.getMonth() - 1);
    renderDateRangePopup();
  }
  function drNextMonth() {
    if (!drState) return;
    drState.month1.setMonth(drState.month1.getMonth() + 1);
    renderDateRangePopup();
  }

  function buildCalMonth(year, month) {
    const M = [
      'January',
      'February',
      'March',
      'April',
      'May',
      'June',
      'July',
      'August',
      'September',
      'October',
      'November',
      'December',
    ];
    const first = new Date(year, month, 1);
    const startDow = first.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const prevDays = new Date(year, month, 0).getDate();
    const today = startOfDay(new Date());
    let cells = '';
    const dayLabels = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
    dayLabels.forEach((d) => {
      cells += `<div class="day-label">${d}</div>`;
    });
    for (let i = 0; i < startDow; i++) {
      cells += `<div class="day other">${prevDays - startDow + 1 + i}</div>`;
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const dt = new Date(year, month, d);
      let cls = 'day';
      if (dt.getTime() === today.getTime()) cls += ' today';
      if (drState) {
        if (drState.from && dt.getTime() === drState.from.getTime()) cls += ' range-start';
        if (drState.to && dt.getTime() === drState.to.getTime()) cls += ' range-end';
        if (drState.from && drState.to && dt > drState.from && dt < drState.to) cls += ' in-range';
        if (drState.from && !drState.to && dt.getTime() === drState.from.getTime())
          cls += ' range-start range-end';
      }
      cells += `<div class="${cls}" data-drday="${fmtISO(dt)}">${d}</div>`;
    }
    const totalCells = startDow + daysInMonth;
    const rem = (7 - (totalCells % 7)) % 7;
    for (let i = 1; i <= rem; i++) {
      cells += `<div class="day other">${i}</div>`;
    }
    return { label: `${M[month]} ${year}`, cells };
  }

  function renderDateRangePopup() {
    let el = document.getElementById('drPopup');
    if (!el) {
      el = document.createElement('div');
      el.id = 'drPopup';
      document.body.appendChild(el);
    }
    if (!drState) {
      el.remove();
      return;
    }
    const m1y = drState.month1.getFullYear(),
      m1m = drState.month1.getMonth();
    const m2 = new Date(m1y, m1m + 1, 1);
    const cal1 = buildCalMonth(m1y, m1m);
    const cal2 = buildCalMonth(m2.getFullYear(), m2.getMonth());
    const presetHtml = DR_PRESETS.map(
      (p) =>
        `<button class="${drState.presetKey === p.key ? 'active' : ''}" data-drpreset="${p.key}">${p.label}</button>`
    ).join('');
    const displayText =
      (drState.from ? fmtDR(drState.from) : '--') + ' – ' + (drState.to ? fmtDR(drState.to) : '--');
    el.className = 'dr-popup';
    el.innerHTML = `
    <div class="dr-presets">${presetHtml}</div>
    <div class="dr-cal-area">
      <div class="dr-cal-months">
        <div class="dr-cal-month"><div class="dr-cal-head"><button data-drnav="prev">‹</button><span class="month-label">${cal1.label}</span><span></span></div><div class="dr-cal-grid">${cal1.cells}</div></div>
        <div class="dr-cal-month"><div class="dr-cal-head"><span></span><span class="month-label">${cal2.label}</span><button data-drnav="next">›</button></div><div class="dr-cal-grid">${cal2.cells}</div></div>
      </div>
      <div class="dr-foot"><span class="dr-display">${displayText}</span><div class="dr-btns"><button class="btn btn-ghost" data-draction="cancel" style="padding:6px 14px;font-size:11px;">Cancel</button><button class="btn btn-gold" data-draction="apply" style="padding:6px 14px;font-size:11px;">Apply</button></div></div>
    </div>`;
    const anchor = document.querySelector(`th[data-col="${drState.col}"] .search-ic`);
    if (anchor) {
      const rect = anchor.getBoundingClientRect();
      el.style.position = 'fixed';
      el.style.top = Math.min(rect.bottom + 6, window.innerHeight - 400) + 'px';
      el.style.left = Math.max(10, Math.min(rect.left - 200, window.innerWidth - 620)) + 'px';
    } else {
      el.style.position = 'fixed';
      el.style.top = '100px';
      el.style.left = '200px';
    }
  }
</script>
