<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base target="_top" />
    <title>App Script Starter Kit</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        max-width: 640px;
        margin: 48px auto;
        padding: 0 24px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 1.5rem;
      }
      button {
        padding: 8px 16px;
        font-size: 1rem;
        cursor: pointer;
      }
      #output {
        margin-top: 16px;
        padding: 12px;
        background: #f4f4f4;
        border-radius: 6px;
        min-height: 24px;
      }
      code {
        background: #eee;
        padding: 2px 6px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>App Script Starter Kit</h1>
    <p>
      This page is served by
      <code>doGet()</code>
      in
      <code>Code.gs</code>
      . Edit
      <code>src/Index.html</code>
      and
      <code>src/Code.gs</code>
      to build your app, then push with
      <code>npm run push</code>
      .
    </p>

    <input id="name" type="text" placeholder="Your name" />
    <button onclick="callServer()">Say hello (via google.script.run)</button>
    <div id="output"></div>

    <script>
      function callServer() {
        var name = document.getElementById('name').value;
        document.getElementById('output').textContent = 'Loading...';
        google.script.run
          .withSuccessHandler(function (result) {
            document.getElementById('output').textContent = result;
          })
          .withFailureHandler(function (err) {
            document.getElementById('output').textContent = 'Error: ' + err.message;
          })
          .sayHello(name);
      }
    </script>
  </body>
</html>
