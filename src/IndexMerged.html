        const tblA = E.rowsA
          .map((r, i) => {
            const info = resolveCascade(seg, r);
            const anyA =
              r.code ||
              r.userId !== '' ||
              r.software ||
              r.name ||
              r.group ||
              r.branchName ||
              r.marginRMS !== '' ||
              r.marginAllocated !== '';
            const showE = E.showErrors && anyA;
            const ec = (cond) => (showE && cond ? ' cell-error' : '');
            return `<tr data-rowa="${i}">
      <td class="rownum">${i + 1}</td>
      <td><input type="text" class="${showE && !r.code ? 'cell-error' : ''}" list="codelist" data-a="code" data-i="${i}" value="${esc(r.code)}" placeholder="Type code…" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" onblur="if(!this.value)this.setAttribute('readonly','')"></td>
      <td>${buildCascadeCellHtml('userId', i, r.userId, info.userId, showE && !r.userId)}</td>
      <td>${buildCascadeCellHtml('software', i, r.software, info.software, showE && !r.software)}</td>
      <td>${buildCascadeCellHtml('name', i, r.name, info.name, showE && !r.name)}</td>
      <td>${buildCascadeCellHtml('group', i, r.group, info.group, showE && !r.group)}</td>
      <td>${buildCascadeCellHtml('branchName', i, r.branchName, info.branchName, showE && !r.branchName)}</td>
      <td><input class="num${ec(r.marginRMS === '')}" type="number" step="any" min="0" inputmode="decimal" data-a="marginRMS" data-i="${i}" value="${esc(r.marginRMS)}" placeholder=""></td>
      <td><input class="num${ec(r.marginAllocated === '')}" type="number" step="any" min="0" inputmode="decimal" data-a="marginAllocated" data-i="${i}" value="${esc(r.marginAllocated)}" placeholder=""></td>
      <td style="text-align:center;"><button class="trash-btn" data-action="del-a" data-i="${i}" title="Delete row">${trashIcon()}</button><div class="row-resize"></div></td>
    </tr>`;
          })
          .join('');

        const tblB = E.rowsB
          .map((r, i) => {
            const anyB = r.group || r.margin !== '';
            const showEB = E.showErrors && anyB;
            return `<tr>
      <td class="rownum">${i + 1}</td>
      <td><input type="text" class="${showEB && !r.group ? 'cell-error' : ''}" list="grouplist" data-b="group" data-i="${i}" value="${esc(r.group)}" placeholder="Select group…" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" onblur="if(!this.value)this.setAttribute('readonly','')"></td>
      <td><input class="num${showEB && r.margin === '' ? ' cell-error' : ''}" type="number" step="any" min="0" inputmode="decimal" data-b="margin" data-i="${i}" value="${esc(r.margin)}" placeholder=""></td>
      <td style="text-align:center;"><button class="trash-btn" data-action="del-b" data-i="${i}" title="Delete row">${trashIcon()}</button><div class="row-resize"></div></td>
    </tr>`;
          })
          .join('');

        const eCols = [
          { k: 'num', label: '#', def: 24, noResize: true },
          { k: 'code', label: 'Code', def: 80 },
          { k: 'userId', label: 'User ID', def: 90 },
          { k: 'software', label: 'Software', def: 70 },
          { k: 'name', label: 'Name', def: 250 },
          { k: 'group', label: 'Group', def: 110 },
          { k: 'branchName', label: 'Branch Name', def: 110 },
          { k: 'marginRMS', label: 'Margin RMS', def: 85 },
          { k: 'marginAllocated', label: 'Margin Alloc.', def: 85 },
          { k: 'del', label: '', def: 28, noResize: true },
        ];
        const eHdr = eCols
          .map((c) => {
            const w = S.entryWidths[c.k] || c.def;
            const handle = c.noResize ? '' : `<div class="eresize" data-ecol="${c.k}"></div>`;
            return `<th class="blk-a" style="width:${w}px;min-width:${w}px;max-width:${w}px;">${c.label}${handle}</th>`;
          })
          .join('');

        const mCount = masterFor(seg).length;
        return `
    <div class="entry-toolbar">
      <div class="date-field"><label>Date <span class="req-star">*</span></label><input type="text" id="entryDate" placeholder="DD-MMM-YYYY" value="${esc(E.date)}" autocomplete="off"></div>
      <span class="seg-badge ${seg}">${segLabel}</span>
      <span style="font-size:10px;color:var(--muted);">Master: ${mCount} rows${mCount ? '' : ' — check MASTER ' + segLabel.toUpperCase() + ' tab'}</span>
      <div style="margin-left:auto;font-size:10px;color:var(--muted);">Saves to RESPONSES ${segLabel.toUpperCase()} & RESPONSES 2 ${segLabel.toUpperCase()}</div>
    </div>
    <div class="entry-panels">
      <div class="entry-panel entry-panel-main">
        <div class="panel-head">${segLabel} Margin Entry <span class="panel-count">${E.rowsA.length} rows</span></div>
        <div class="entry-scroll"><table class="entry" style="table-layout:fixed;"><thead><tr>${eHdr}</tr></thead><tbody>${tblA}</tbody></table></div>
        <div class="panel-foot">
          <button class="btn btn-ghost" data-action="add-a">+ Add Row</button>
          <button class="btn btn-gold" data-action="submit-entry" ${S.saving ? 'disabled' : ''}>${S.saving ? '<span class="spinner" style="width:14px;height:14px;border-width:2px;"></span> Saving…' : 'Save All Entries'}</button>
          <span style="margin-left:auto;font-size:11px;color:var(--muted);">Saving as: <b style="color:var(--ink);">${esc(S.user.name)}</b></span>
        </div>
      </div>
      <div class="entry-panel entry-panel-side">
        <div class="panel-head">Group Margin <span class="panel-count">${E.rowsB.length} rows</span></div>
        <div class="entry-scroll"><table class="entry entry-b"><thead><tr>
          <th class="blk-b" style="width:28px;">#</th><th class="blk-b">Group Name</th><th class="blk-b">Group Margin</th><th class="blk-b" style="width:32px;"></th>
        </tr></thead><tbody>${tblB}</tbody></table></div>
        <div class="panel-foot"><button class="btn btn-ghost" data-action="add-b">+ Add Row</button></div>
      </div>
    </div>
    <datalist id="codelist">${uniqueCodes(seg)
      .map((c) => `<option value="${esc(c)}">`)
      .join('')}</datalist>
    <datalist id="grouplist">${groupNamesList(seg)
      .map((g) => `<option value="${esc(g)}">`)
      .join('')}</datalist>`;
      }

      async function submitEntry() {
        const seg = currentSegment();
        if (!seg) return;
        const E = S.entry[seg];
        const dateVal = document.getElementById('entryDate')?.value || E.date;
        E.date = dateVal;
        const validA = [],
          validB = [];
        let errA = false,
          errB = false;
        E.rowsA.forEach((r) => {
          const any =
            r.code ||
            r.userId ||
            r.software ||
            r.name ||
            r.group ||
            r.branchName ||
            r.marginRMS !== '' ||
            r.marginAllocated !== '';
          if (!any) return;
          const ok =
            r.code &&
            r.userId !== '' &&
            r.software &&
            r.name &&
            r.group &&
            r.branchName &&
            r.marginRMS !== '' &&
            r.marginAllocated !== '';
          if (!ok) {
            errA = true;
            return;
          }
          validA.push(r);
        });
        E.rowsB.forEach((r) => {
          const any = r.group || r.margin !== '';
          if (!any) return;
          if (!r.group || r.margin === '') {
            errB = true;
            return;
          }
          validB.push(r);
        });

        const dateMissing = !dateVal && (validA.length || validB.length || errA || errB);
        if (dateMissing || errA || errB) {
          E.showErrors = true;
          render();
          return;
        }
        if (!validA.length && !validB.length) {
          return;
        }

        E.showErrors = false;
        const ts = fmtNow();
        const disp = fmtDateDisplay(dateVal);
        const loginName = S.user.name || S.user.id || '';
        const newA = validA.map((r) => ({
          timestamp: ts,
          date: disp,
          code: r.code,
          userId: r.userId,
          software: r.software,
          name: r.name,
          group: r.group,
          marginRMS: r.marginRMS,
          marginAllocated: r.marginAllocated,
          branchName: r.branchName,
          loginName: loginName,
        }));
        const newB = validB.map((r) => ({
          timestamp: ts,
          date: disp,
          group: r.group,
          margin: r.margin,
          loginName: loginName,
        }));

        S.saving = true;
        render();
        showSavingOverlay('Saving entries…');
        try {
          const result = await runServer('saveEntries', {
            segment: seg,
            responses1: newA,
            responses2: newB,
          });
          S.saving = false;
          hideSavingOverlay();
          if (result.status !== 'ok') {
            showToast('Save failed: ' + (result.message || 'unknown error'), true);
            return;
          }
          if (seg === 'equity') {
            S.respEquity.push(...newA);
            S.resp2Equity.push(...newB);
          } else {
            S.respCommodity.push(...newA);
            S.resp2Commodity.push(...newB);
          }
          S.entry[seg] = freshSeg();
          showToast(
            `Saved ${result.savedA} entry row(s) and ${result.savedB} group row(s) to ${seg === 'equity' ? 'Equity' : 'Commodity'} sheets.`,
            false
          );
        } catch (err) {
          S.saving = false;
          hideSavingOverlay();
          showToast('Save failed: ' + err.message, true);
        }
      }
    </script>
    <script>
      /* ============================= DATA TABLES ============================= */
      const RESP1_COLS = [
        { key: 'timestamp', label: 'Timestamp', width: 170 },
        { key: 'date', label: 'Date', width: 115 },
        { key: 'code', label: 'Code', pill: true, width: 110 },
        { key: 'userId', label: 'User ID', width: 110 },
        { key: 'software', label: 'Software', width: 100 },
        { key: 'name', label: 'Name', width: 300 },
        { key: 'group', label: 'Group Name', width: 150 },
        { key: 'marginRMS', label: 'Margin as per RMS', width: 150 },
        { key: 'marginAllocated', label: 'Margin Allocated on ID', width: 170 },
        { key: 'loginName', label: 'Login Name', width: 140 },
      ];
      const RESP2_COLS = [
        { key: 'timestamp', label: 'Timestamp', width: 170 },
        { key: 'date', label: 'Date', width: 115 },
        { key: 'group', label: 'Group Name', width: 220 },
        { key: 'margin', label: 'Group Margin', width: 150 },
        { key: 'loginName', label: 'Login Name', width: 140 },
      ];
      const MASTER_COLS = [
        { key: 'code', label: 'Code', pill: true, width: 120 },
        { key: 'userId', label: 'User ID', width: 130 },
        { key: 'software', label: 'Software', width: 110 },
        { key: 'name', label: 'Name', width: 340 },
        { key: 'group', label: 'Group Name', width: 180 },
        { key: 'branchName', label: 'Branch Name', width: 130 },
        { key: 'timestamp', label: 'Timestamp', width: 170 },
        { key: 'loginId', label: 'Login ID', width: 120 },
      ];
      const TABLE_DEFS = {
        resp1Equity: { cols: RESP1_COLS, data: () => S.respEquity },
        resp1Commodity: { cols: RESP1_COLS, data: () => S.respCommodity },
        resp2Equity: { cols: RESP2_COLS, data: () => S.resp2Equity },
        resp2Commodity: { cols: RESP2_COLS, data: () => S.resp2Commodity },
        masterEquity: { cols: MASTER_COLS, data: () => S.masterEquity },
        masterCommodity: { cols: MASTER_COLS, data: () => S.masterCommodity },
      };

      function renderDataTable(tableKey) {
        const def = TABLE_DEFS[tableKey];
        const st = S.dt[tableKey];
        let rows = def.data().slice();
        Object.entries(st.filters).forEach(([k, v]) => {
          if (!v) return;
          rows = rows.filter((r) =>
            String(r[k] ?? '')
              .toLowerCase()
              .includes(v.toLowerCase())
          );
        });
        Object.entries(st.dateFilters || {}).forEach(([k, df]) => {
          if (!df) return;
          const from = df.from ? parseDT(df.from) : null;
          const to = df.to ? parseDT(df.to + (df.to.length <= 10 ? ' 23:59:59' : '')) : null;
          if (!from && !to) return;
          rows = rows.filter((r) => {
            const d = parseDT(r[k]);
            if (d === null) return false;
            if (from && d < from) return false;
            if (to && d > to) return false;
            return true;
          });
        });
        if (st.sort) {
          const isDateCol = st.sort === 'timestamp' || st.sort === 'date';
          rows.sort((a, b) => {
            let x = a[st.sort],
              y = b[st.sort];
            if (isDateCol) {
              const dx = parseDT(x),
                dy = parseDT(y);
              const ex = dx === null,
                ey = dy === null;
              if (ex && ey) return 0;
              if (ex) return 1;
              if (ey) return -1;
              return (dx - dy) * st.dir;
            }
            const nx = parseFloat(x),
              ny = parseFloat(y);
            if (
              !isNaN(nx) &&
              !isNaN(ny) &&
              String(nx) === String(x).trim() &&
              String(ny) === String(y).trim()
            ) {
              x = nx;
              y = ny;
            }
            if (x < y) return -1 * st.dir;
            if (x > y) return 1 * st.dir;
            return 0;
          });
        }
        const total = rows.length;
        const ps = st.pageSize;
        const tp = Math.max(1, Math.ceil(total / ps));
        if (st.page > tp) st.page = tp;
        if (st.page < 1) st.page = 1;
        const si = (st.page - 1) * ps;
        const pageRows = rows.slice(si, si + ps);
        const visCols = def.cols.filter((c) => !st.hidden.has(c.key));
        const snoTh = `<th style="width:60px;min-width:60px;max-width:60px;"><div class="th-inner"><div class="th-row"><span class="th-label" style="cursor:default;">S.No</span></div></div></th>`;
        const hdr =
          snoTh +
          visCols
            .map((c) => {
              const w = st.widths[c.key] || c.width || 150;
              const si2 = st.sort === c.key ? (st.dir === 1 ? '▲' : '▼') : '';
              const fo = st.filterOpen === c.key;
              const isDate = isDateColumn(c.key);
              let filterHtml = '';
              if (fo) {
                if (isDate) {
                  const df = st.dateFilters[c.key] || { from: '', to: '' };
                  const dispVal =
                    df.from || df.to
                      ? (df.from ? fmtDR(new Date(df.from + 'T00:00:00')) : '…') +
                        ' – ' +
                        (df.to ? fmtDR(new Date(df.to + 'T00:00:00')) : '…')
                      : '';
                  filterHtml = `<div class="th-filter th-date-filter"><input type="text" readonly data-action="open-daterange" data-table="${tableKey}" data-col="${c.key}" value="${esc(dispVal)}" placeholder="Select date range…">${dispVal ? `<span class="dr-clear" data-action="clear-daterange" data-table="${tableKey}" data-col="${c.key}">✕</span>` : ''}</div>`;
                } else {
                  filterHtml = `<div class="th-filter"><input type="text" placeholder="Filter…" data-action="filter" data-table="${tableKey}" data-col="${c.key}" value="${esc(st.filters[c.key] || '')}"></div>`;
                }
              }
              return `<th style="width:${w}px;min-width:${w}px;max-width:${w}px;" data-col="${c.key}">
      <div class="th-inner"><div class="th-row">
        <span class="th-label" data-action="sort" data-table="${tableKey}" data-col="${c.key}">${esc(c.label)}</span>
        <span class="sort-ic">${si2}</span>
        <span class="search-ic" data-action="togglesearch" data-table="${tableKey}" data-col="${c.key}">${isDate ? '📅' : '⌕'}</span>
      </div>
      ${filterHtml}
      <div class="resize-handle" data-action="resize" data-table="${tableKey}" data-col="${c.key}"></div>
      </div></th>`;
            })
            .join('');
        const bod = pageRows.length
          ? pageRows
              .map(
                (r, idx) =>
                  `<tr><td style="text-align:center;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11.5px;">${si + idx + 1}</td>${visCols
                    .map((c) => {
                      const v = r[c.key] == null ? '' : r[c.key];
                      return `<td>${c.pill && v ? `<span class="code-pill">${esc(v)}</span>` : esc(v)}</td>`;
                    })
                    .join('')}</tr>`
              )
              .join('')
          : `<tr><td colspan="${visCols.length + 1}"><div class="empty-state"><div class="big">No matching rows</div>Filters adjust karke dekho, ya abhi koi data nahi hai.</div></td></tr>`;
        const rf = total === 0 ? 0 : si + 1;
        const rt = Math.min(si + ps, total);
        const addPerm =
          tableKey === 'masterEquity'
            ? 'masterEquityAdd'
            : tableKey === 'masterCommodity'
              ? 'masterCommodityAdd'
              : null;
        const canAdd = addPerm && S.user && S.user[addPerm];
        return `
    <div class="dt-toolbar">
      <div class="count">${total} of ${def.data().length} rows</div>
      <button class="btn btn-ghost" data-action="syncnow" style="padding:7px 14px;">${S.syncing ? '⟳ Refreshing…' : '⟳ Refresh'}</button>
      ${canAdd ? `<button class="btn btn-gold" data-action="open-master-add" data-seg="${tableKey === 'masterCommodity' ? 'commodity' : 'equity'}" style="padding:7px 14px;">+ Add</button>` : ''}
      <div class="dt-colmenu-wrap">
        <button class="btn btn-ghost" data-action="togglecolmenu" data-table="${tableKey}" style="padding:7px 14px;">Columns ▾</button>
        ${S.colMenuOpen === tableKey ? `<div class="dt-colmenu"><div class="h">Show / hide columns</div>${def.cols.map((c) => `<label><input type="checkbox" data-action="togglecol" data-table="${tableKey}" data-col="${c.key}" ${st.hidden.has(c.key) ? '' : 'checked'}> ${esc(c.label)}</label>`).join('')}</div>` : ''}
      </div>
    </div>
    <div class="dt-table-wrap">
      <div class="dt-scroll"><table class="dt"><thead><tr>${hdr}</tr></thead><tbody>${bod}</tbody></table></div>
      <div class="dt-pagination">
        <div class="pp">Rows per page: <select data-action="pagesize" data-table="${tableKey}">${PAGE_SIZE_OPTIONS.map((n) => `<option value="${n}" ${st.pageSize === n ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
        <div>${total === 0 ? '0' : `${rf}–${rt}`} of ${total}</div>
        <div class="nav">
          <button data-action="pagefirst" data-table="${tableKey}" ${st.page <= 1 ? 'disabled' : ''}>«</button>
          <button data-action="pageprev" data-table="${tableKey}" ${st.page <= 1 ? 'disabled' : ''}>‹</button>
          <span class="pageinfo">${st.page} / ${tp}</span>
          <button data-action="pagenext" data-table="${tableKey}" ${st.page >= tp ? 'disabled' : ''}>›</button>
          <button data-action="pagelast" data-table="${tableKey}" ${st.page >= tp ? 'disabled' : ''}>»</button>
        </div>
      </div>
    </div>`;
      }
    </script>
    <script>
      /* ============================= REPORT ============================= */
      const MONTH_NAMES = [
        'Jan',
        'Feb',
        'Mar',
        'Apr',
        'May',
        'Jun',
        'Jul',
        'Aug',
        'Sep',
        'Oct',
        'Nov',
        'Dec',
      ];
      const MONTH_FULL = [
        'January',
        'February',
        'March',
        'April',
        'May',
        'June',
        'July',
        'August',
        'September',
        'October',
        'November',
        'December',
      ];

      function renderReport(seg) {
        const segLabel = seg === 'commodity' ? 'Commodity' : 'Equity';
        const data = seg === 'commodity' ? S.respCommodity : S.respEquity;
        const resp2Data = seg === 'commodity' ? S.resp2Commodity : S.resp2Equity;
        const R = S.report;
        const numMonths = 4;

        let groups = {};
        data.forEach((row) => {
          const key = `${row.code}|||${row.userId}|||${row.software}|||${row.name}|||${row.group}`;
          if (!groups[key])
            groups[key] = {
              code: row.code,
              userId: row.userId,
              software: row.software,
              name: row.name,
              group: row.group,
              branchName: row.branchName || '',
              entries: [],
            };
          groups[key].entries.push(row);
          // Keep branchName from latest entry if available
          if (row.branchName && !groups[key].branchName) groups[key].branchName = row.branchName;
        });

        // Build a lookup of resp2 entries indexed by group name for quick access
        let resp2ByGroup = {};
        resp2Data.forEach((row) => {
          const g = row.group || '';
          if (!resp2ByGroup[g]) resp2ByGroup[g] = [];
          resp2ByGroup[g].push(row);
        });

        const months = [];
        for (let i = 0; i < numMonths; i++) {
          let m = R.month + i,
            y = R.year;
          while (m > 11) {
            m -= 12;
            y++;
          }
          months.push({ m, y, label: `${MONTH_NAMES[m]} ${y}` });
        }

        let groupList = Object.values(groups);

        if (R.search) {
          const q = R.search.toLowerCase();
          groupList = groupList.filter(
            (g) =>
              g.code.toLowerCase().includes(q) ||
              g.userId.toLowerCase().includes(q) ||
              g.software.toLowerCase().includes(q) ||
              g.name.toLowerCase().includes(q) ||
              g.group.toLowerCase().includes(q) ||
              g.branchName.toLowerCase().includes(q)
          );
        }

        groupList.forEach((g) => {
          g._hasData = months.some((mo) =>
            g.entries.some((e) => {
              const d = parseDT(e.timestamp) || parseDT(e.date);
              if (!d) return false;
              const dt = new Date(d);
              return dt.getMonth() === mo.m && dt.getFullYear() === mo.y;
            })
          );
        });

        if (R.filter === 'change') groupList = groupList.filter((g) => g._hasData);
        else if (R.filter === 'nochange') groupList = groupList.filter((g) => !g._hasData);

        if (R.sort) {
          const key = R.sort;
          const dir = R.sortDir;
          groupList.sort((a, b) => {
            let x = (a[key] || '').toLowerCase(),
              y = (b[key] || '').toLowerCase();
            if (x < y) return -1 * dir;
            if (x > y) return 1 * dir;
            return 0;
          });
        }

        const RPT_FIXED_COLS = [
          { k: 'code', l: 'Code', def: 90 },
          { k: 'userId', l: 'User ID', def: 90 },
          { k: 'software', l: 'Software', def: 80 },
          { k: 'name', l: 'Name', def: 200 },
          { k: 'group', l: 'Group Name', def: 120 },
          { k: 'branchName', l: 'Branch Name', def: 110, last: true },
        ];
        const fixedHdr =
          `<th class="rpt-th-fixed" rowspan="2" style="cursor:default;width:32px;min-width:32px;">S.No</th>` +
          RPT_FIXED_COLS.map((c) => {
            const si = R.sort === c.k ? (R.sortDir === 1 ? '▲' : '▼') : '';
            const w = R.widths[c.k] || c.def;
            return `<th class="rpt-th-fixed${c.last ? ' rpt-group-end' : ''}" rowspan="2" data-action="rpt-sort" data-col="${c.k}" style="width:${w}px;">${c.l}<span class="sort-ic">${si}</span><div class="th-search"><input type="text" placeholder="Filter…" data-action="rpt-search" data-col="${c.k}" value="${esc(R['f_' + c.k] || '')}" onclick="event.stopPropagation()"></div><div class="rpt-resize" data-action="rpt-resize" data-col="${c.k}"></div></th>`;
          }).join('');
        const monthHdrRow1 = months
          .map((mo, mi) => {
            const bc = mi > 0 ? ' rpt-month-border' : '';
            return `<th class="rpt-th-month-top${bc}" colspan="4">${mo.label}</th>`;
          })
          .join('');
        const monthHdrRow2 = months
          .map((mo, mi) => {
            const rmsSort = R.monthSort === `rms_${mi}` ? (R.monthSortDir === 1 ? ' ▲' : ' ▼') : '';
            const allocSort =
              R.monthSort === `alloc_${mi}` ? (R.monthSortDir === 1 ? ' ▲' : ' ▼') : '';
            const bc = mi > 0 ? ' rpt-month-border' : '';
            const wDate = R.widths[`date_${mi}`] || 80;
            const wRms = R.widths[`rms_${mi}`] || 80;
            const wAlloc = R.widths[`alloc_${mi}`] || 80;
            const wGrpM = R.widths[`grpm_${mi}`] || 120;
            return `<th class="rpt-th-month-sub${bc}" style="width:${wDate}px;">Date<div class="rpt-resize" data-action="rpt-resize" data-col="date_${mi}"></div></th><th class="rpt-th-month-sub" style="width:${wRms}px;" data-action="rpt-sort-month" data-col="rms_${mi}">Margin RMS${rmsSort}<div class="rpt-resize" data-action="rpt-resize" data-col="rms_${mi}"></div></th><th class="rpt-th-month-sub" style="width:${wAlloc}px;" data-action="rpt-sort-month" data-col="alloc_${mi}">Margin ON ID${allocSort}<div class="rpt-resize" data-action="rpt-resize" data-col="alloc_${mi}"></div></th><th class="rpt-th-month-sub" style="width:${wGrpM}px;">Group Margin<div class="rpt-resize" data-action="rpt-resize" data-col="grpm_${mi}"></div></th>`;
          })
          .join('');

        RPT_FIXED_COLS.forEach((c) => {
          const fv = R['f_' + c.k];
          if (fv) {
            const q = fv.toLowerCase();
            groupList = groupList.filter((g) => (g[c.k] || '').toLowerCase().includes(q));
          }
        });

        if (R.monthSort) {
          const parts = R.monthSort.split('_');
          const type = parts[0];
          const mi = parseInt(parts[1], 10);
          const mo = months[mi];
          if (mo) {
            const field = type === 'rms' ? 'marginRMS' : 'marginAllocated';
            groupList.sort((a, b) => {
              const getVal = (g) => {
                const mEntries = g.entries.filter((e) => {
                  const d = parseDT(e.timestamp) || parseDT(e.date);
                  if (!d) return false;
                  const dt = new Date(d);
                  return dt.getMonth() === mo.m && dt.getFullYear() === mo.y;
                });
                if (!mEntries.length) return null;
                let sum = 0;
                mEntries.forEach((e) => {
                  const v = parseFloat(e[field]);
                  if (!isNaN(v)) sum += v;
                });
                return sum;
              };
              const va = getVal(a),
                vb = getVal(b);
              if (va === null && vb === null) return 0;
              if (va === null) return 1;
              if (vb === null) return -1;
              return (va - vb) * R.monthSortDir;
            });
          }
        }

        const bodyRows = groupList
          .map((g, idx) => {
            const fixedCells = `<td class="rpt-td-sno">${idx + 1}</td><td class="rpt-td-code"><span class="code-pill">${esc(g.code)}</span></td><td class="rpt-td">${esc(g.userId)}</td><td class="rpt-td">${esc(g.software)}</td><td class="rpt-td rpt-td-name">${esc(g.name)}</td><td class="rpt-td">${esc(g.group)}</td><td class="rpt-td rpt-group-end">${esc(g.branchName)}</td>`;

            // Get resp2 entries for this group
            const grpResp2 = resp2ByGroup[g.group] || [];

            const monthCells = months
              .map((mo, mi) => {
                const mEntries = g.entries.filter((e) => {
                  const d = parseDT(e.timestamp) || parseDT(e.date);
                  if (!d) return false;
                  const dt = new Date(d);
                  return dt.getMonth() === mo.m && dt.getFullYear() === mo.y;
                });
                // Group Margin from Responses 2 for this group in this month
                const grpMEntries = grpResp2.filter((e) => {
                  const d = parseDT(e.timestamp) || parseDT(e.date);
                  if (!d) return false;
                  const dt = new Date(d);
                  return dt.getMonth() === mo.m && dt.getFullYear() === mo.y;
                });
                const borderCls = mi > 0 ? ' rpt-month-border' : '';

                // Group Margin cell: show date - margin pairs
                let grpMHtml = '';
                if (grpMEntries.length) {
                  grpMHtml = grpMEntries
                    .map((e) => {
                      const d = e.date || '';
                      const m = e.margin || '';
                      return esc(d) + ' - ' + esc(String(m));
                    })
                    .join('<br>');
                }

                if (!mEntries.length && !grpMEntries.length)
                  return `<td class="rpt-td rpt-td-empty${borderCls}"></td><td class="rpt-td rpt-td-empty"></td><td class="rpt-td rpt-td-empty"></td><td class="rpt-td rpt-td-empty"></td>`;
                const dateCol = mEntries.map((e) => esc(e.date || '')).join('<br>');
                const rmsCol = mEntries.map((e) => esc(String(e.marginRMS || ''))).join('<br>');
                const allocCol = mEntries
                  .map((e) => esc(String(e.marginAllocated || '')))
                  .join('<br>');
                return `<td class="rpt-td rpt-td-data${borderCls}">${dateCol}</td><td class="rpt-td rpt-td-num">${rmsCol}</td><td class="rpt-td rpt-td-num">${allocCol}</td><td class="rpt-td rpt-td-data">${grpMHtml}</td>`;
              })
              .join('');

            return `<tr>${fixedCells}${monthCells}</tr>`;
          })
          .join('');

        const monthOpts = MONTH_FULL.map(
          (m, i) => `<option value="${i}" ${i === R.month ? 'selected' : ''}>${m}</option>`
        ).join('');
        const curYear = new Date().getFullYear();
        const yearOpts = [];
        for (let y = curYear - 2; y <= curYear + 2; y++)
          yearOpts.push(`<option value="${y}" ${y === R.year ? 'selected' : ''}>${y}</option>`);

        return `
    <div class="rpt-toolbar">
      <span class="seg-badge ${seg}">${segLabel}</span>
      <div class="rpt-month-selector">
        <label>Month:</label>
        <select data-action="rpt-month">${monthOpts}</select>
        <select data-action="rpt-year">${yearOpts.join('')}</select>
      </div>
      <div class="rpt-toggle-btns">
        <button class="${R.filter === 'all' ? 'active' : ''}" data-action="rpt-filter" data-val="all">All</button>
        <button class="${R.filter === 'change' ? 'active' : ''}" data-action="rpt-filter" data-val="change">Change</button>
        <button class="${R.filter === 'nochange' ? 'active' : ''}" data-action="rpt-filter" data-val="nochange">No Change</button>
      </div>
      <div class="rpt-count">${groupList.length} entries</div>
    </div>
    <div class="rpt-table-wrap">
      <div class="rpt-scroll">
        <table class="rpt-table">
          <thead><tr>${fixedHdr}${monthHdrRow1}</tr><tr>${monthHdrRow2}</tr></thead>
          <tbody>${bodyRows || `<tr><td colspan="${7 + numMonths * 4}" class="rpt-empty">No data found for this selection.</td></tr>`}</tbody>
        </table>
      </div>
    </div>`;
      }
    </script>
    <script>
      /* ============================= MASTER "+ ADD" POPUP ============================= */
      const MASTER_ADD_FIELDS = [
        { k: 'code', label: 'Code' },
        { k: 'userId', label: 'User ID' },
        { k: 'software', label: 'Software' },
        { k: 'name', label: 'Name' },
        { k: 'group', label: 'Group Name' },
        { k: 'branchName', label: 'Branch Name' },
      ];
      function openMasterAdd(seg) {
        S.masterAdd = {
          seg,
          code: '',
          userId: '',
          software: '',
          name: '',
          group: '',
          branchName: '',
          error: '',
          saving: false,
          showErrors: false,
        };
        const html = renderMasterAddModal();
        if (html) {
          let container = document.getElementById('masterAddContainer');
          if (!container) {
            container = document.createElement('div');
            container.id = 'masterAddContainer';
            document.body.appendChild(container);
          }
          container.innerHTML = html;
        }
      }
      function closeMasterAdd() {
        S.masterAdd = null;
        const container = document.getElementById('masterAddContainer');
        if (container) container.innerHTML = '';
      }
      function masterAddOptions(seg, field) {
        const rows = seg === 'commodity' ? S.masterCommodity : S.masterEquity;
        return Array.from(new Set(rows.map((r) => r[field]).filter(Boolean))).sort();
      }
      function onMasterAddInput(el) {
        if (!S.masterAdd) return;
        const f = el.getAttribute('data-madd');
        if (!f) return;
        S.masterAdd[f] = el.value;
        if (el.classList.contains('cell-error') && el.value) el.classList.remove('cell-error');
      }
      function renderMasterAddModal() {
        const M = S.masterAdd;
        if (!M) return '';
        const segLabel = M.seg === 'commodity' ? 'Commodity' : 'Equity';
        const fieldsHtml = MASTER_ADD_FIELDS.map((f) => {
          const opts = masterAddOptions(M.seg, f.k);
          const listId = `madd-${f.k}`;
          const isErr = M.showErrors && !String(M[f.k] || '').trim();
          return `<div class="field">
      <label>${f.label} <span class="req-star">*</span></label>
      <input type="text" class="${isErr ? 'cell-error' : ''}" data-madd="${f.k}" list="${listId}" value="${esc(M[f.k])}" placeholder="Select or type ${esc(f.label.toLowerCase())}…" autocomplete="off">
      <datalist id="${listId}">${opts.map((o) => `<option value="${esc(o)}">`).join('')}</datalist>
    </div>`;
        }).join('');
        return `<div class="modal-overlay" data-action="master-add-overlay">
    <div class="modal-card">
      <div class="modal-head"><h3>Add Master Entry <span class="seg-badge ${M.seg}">${segLabel}</span></h3><button class="modal-close" data-action="close-master-add">✕</button></div>
      <div class="modal-body">
        ${M.error ? `<div class="modal-error">${esc(M.error)}</div>` : ''}
        ${fieldsHtml}
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-action="close-master-add">Cancel</button>
        <button class="btn btn-gold" data-action="save-master-add" ${M.saving ? 'disabled' : ''}>${M.saving ? '<span class="spinner" style="width:14px;height:14px;border-width:2px;"></span> Saving…' : 'Save'}</button>
      </div>
    </div>
  </div>`;
      }
      function rerenderModal() {
        const container = document.getElementById('masterAddContainer');
        if (!container) return;
        const html = renderMasterAddModal();
        container.innerHTML = html || '';
      }

      async function saveMasterAdd() {
        const M = S.masterAdd;
        if (!M) return;
        const missing = MASTER_ADD_FIELDS.some((f) => !String(M[f.k] || '').trim());
        if (missing) {
          M.showErrors = true;
          M.error = 'Sabhi 6 fields bharna zaroori hai.';
          rerenderModal();
          return;
        }
        M.error = '';
        M.saving = true;
        rerenderModal();
        showSavingOverlay('Saving master entry…');
        try {
          const result = await runServer('addMasterEntry', {
            segment: M.seg,
            code: M.code,
            userId: M.userId,
            software: M.software,
            name: M.name,
            group: M.group,
            branchName: M.branchName,
            loginId: S.user.id,
          });
          hideSavingOverlay();
          if (result.status !== 'ok') {
            M.saving = false;
            M.error = result.message || 'Save failed.';
            rerenderModal();
            return;
          }
          if (M.seg === 'commodity') S.masterCommodity.push(result.row);
          else S.masterEquity.push(result.row);
          closeMasterAdd();
          render();
          showToast('Master entry added successfully.', false);
        } catch (err) {
          hideSavingOverlay();
          M.saving = false;
          M.error = err.message;
          rerenderModal();
        }
      }
    </script>
    <script>
      /* ============================= DATE RANGE PICKER (Table Filter) ============================= */
      let drState = null;

      const DR_PRESETS = [
        {
          key: 'today',
          label: 'Today',
          fn: () => {
            const t = startOfDay(new Date());
            return [t, t];
          },
        },
        {
          key: 'yesterday',
          label: 'Yesterday',
          fn: () => {
            const d = new Date();
            d.setDate(d.getDate() - 1);
            const t = startOfDay(d);
            return [t, t];
          },
        },
        {
          key: 'tomorrow',
          label: 'Tomorrow',
          fn: () => {
            const d = new Date();
            d.setDate(d.getDate() + 1);
            const t = startOfDay(d);
            return [t, t];
          },
        },
        {
          key: 'thisWeek',
          label: 'This Week',
          fn: () => {
            const d = new Date();
            const s = new Date(d);
            s.setDate(d.getDate() - d.getDay());
            return [startOfDay(s), startOfDay(d)];
          },
        },
        {
          key: 'lastWeek',
          label: 'Last Week',
          fn: () => {
            const d = new Date();
            const e = new Date(d);
            e.setDate(d.getDate() - d.getDay() - 1);
            const s = new Date(e);
            s.setDate(e.getDate() - 6);
            return [startOfDay(s), startOfDay(e)];
          },
        },
        {
          key: 'last7',
          label: 'Last 7 Days',
          fn: () => {
            const d = new Date();
            const s = new Date(d);
            s.setDate(d.getDate() - 6);
            return [startOfDay(s), startOfDay(d)];
          },
        },
        {
          key: 'last30',
          label: 'Last 30 Days',
          fn: () => {
            const d = new Date();
            const s = new Date(d);
            s.setDate(d.getDate() - 29);
            return [startOfDay(s), startOfDay(d)];
          },
        },
        {
          key: 'thisMonth',
          label: 'This Month',
          fn: () => {
            const d = new Date();
            return [startOfDay(new Date(d.getFullYear(), d.getMonth(), 1)), startOfDay(d)];
          },
        },
        {
          key: 'lastMonth',
          label: 'Last Month',
          fn: () => {
            const d = new Date();
            const e = new Date(d.getFullYear(), d.getMonth(), 0);
            const s = new Date(e.getFullYear(), e.getMonth(), 1);
            return [startOfDay(s), startOfDay(e)];
          },
        },
      ];
      function startOfDay(d) {
        return new Date(d.getFullYear(), d.getMonth(), d.getDate());
      }
      function fmtDR(d) {
        if (!d) return '';
        const p = (n) => String(n).padStart(2, '0');
        const M = [
          'Jan',
          'Feb',
          'Mar',
          'Apr',
          'May',
          'Jun',
          'Jul',
          'Aug',
          'Sep',
          'Oct',
          'Nov',
          'Dec',
        ];
        return `${p(d.getDate())}-${M[d.getMonth()]}-${d.getFullYear()}`;
      }
      function fmtISO(d) {
        if (!d) return '';
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      }

      function openDateRange(tableKey, colKey) {
        const st = S.dt[tableKey];
        const existing = st.dateFilters && st.dateFilters[colKey];
        const from = existing && existing.from ? new Date(existing.from + 'T00:00:00') : null;
        const to = existing && existing.to ? new Date(existing.to + 'T00:00:00') : null;
        const m1 = from || new Date();
        drState = {
          table: tableKey,
          col: colKey,
          from,
          to,
          month1: new Date(m1.getFullYear(), m1.getMonth(), 1),
          selecting: null,
          presetKey: null,
        };
        renderDateRangePopup();
      }
      function closeDateRange() {
        drState = null;
        const el = document.getElementById('drPopup');
        if (el) el.remove();
      }
      function applyDateRange() {
        if (!drState) return;
        const st = S.dt[drState.table];
        if (!st.dateFilters) st.dateFilters = {};
        if (drState.from || drState.to) {
          st.dateFilters[drState.col] = { from: fmtISO(drState.from), to: fmtISO(drState.to) };
        } else {
          delete st.dateFilters[drState.col];
        }
        st.page = 1;
        closeDateRange();
        render();
      }
      function clearDateRange() {
        if (!drState) return;
        const st = S.dt[drState.table];
        if (st.dateFilters) delete st.dateFilters[drState.col];
        st.page = 1;
        closeDateRange();
        render();
      }
      function drSelectDay(d) {
        if (!drState) return;
        if (!drState.from || drState.to) {
          drState.from = d;
          drState.to = null;
          drState.presetKey = null;
        } else {
          if (d < drState.from) {
            drState.to = drState.from;
            drState.from = d;
          } else drState.to = d;
          drState.presetKey = null;
        }
        renderDateRangePopup();
      }
      function drSelectPreset(key) {
        const p = DR_PRESETS.find((x) => x.key === key);
        if (!p || !drState) return;
        const [f, t] = p.fn();
        drState.from = f;
        drState.to = t;
        drState.presetKey = key;
        drState.month1 = new Date(f.getFullYear(), f.getMonth(), 1);
        renderDateRangePopup();
      }
      function drPrevMonth() {
        if (!drState) return;
        drState.month1.setMonth(drState.month1.getMonth() - 1);
        renderDateRangePopup();
      }
      function drNextMonth() {
        if (!drState) return;
        drState.month1.setMonth(drState.month1.getMonth() + 1);
        renderDateRangePopup();
      }

      function buildCalMonth(year, month) {
        const M = [
          'January',
          'February',
          'March',
          'April',
          'May',
          'June',
          'July',
          'August',
          'September',
          'October',
          'November',
          'December',
        ];
        const first = new Date(year, month, 1);
        const startDow = first.getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const prevDays = new Date(year, month, 0).getDate();
        const today = startOfDay(new Date());
        let cells = '';
        const dayLabels = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
        dayLabels.forEach((d) => {
          cells += `<div class="day-label">${d}</div>`;
        });
        for (let i = 0; i < startDow; i++) {
          cells += `<div class="day other">${prevDays - startDow + 1 + i}</div>`;
        }
        for (let d = 1; d <= daysInMonth; d++) {
          const dt = new Date(year, month, d);
          let cls = 'day';
          if (dt.getTime() === today.getTime()) cls += ' today';
          if (drState) {
            if (drState.from && dt.getTime() === drState.from.getTime()) cls += ' range-start';
            if (drState.to && dt.getTime() === drState.to.getTime()) cls += ' range-end';
            if (drState.from && drState.to && dt > drState.from && dt < drState.to)
              cls += ' in-range';
            if (drState.from && !drState.to && dt.getTime() === drState.from.getTime())
              cls += ' range-start range-end';
          }
          cells += `<div class="${cls}" data-drday="${fmtISO(dt)}">${d}</div>`;
        }
        const totalCells = startDow + daysInMonth;
        const rem = (7 - (totalCells % 7)) % 7;
        for (let i = 1; i <= rem; i++) {
          cells += `<div class="day other">${i}</div>`;
        }
        return { label: `${M[month]} ${year}`, cells };
      }

      function renderDateRangePopup() {
        let el = document.getElementById('drPopup');
        if (!el) {
          el = document.createElement('div');
          el.id = 'drPopup';
          document.body.appendChild(el);
        }
        if (!drState) {
          el.remove();
          return;
        }
        const m1y = drState.month1.getFullYear(),
          m1m = drState.month1.getMonth();
        const m2 = new Date(m1y, m1m + 1, 1);
        const cal1 = buildCalMonth(m1y, m1m);
        const cal2 = buildCalMonth(m2.getFullYear(), m2.getMonth());
        const presetHtml = DR_PRESETS.map(
          (p) =>
            `<button class="${drState.presetKey === p.key ? 'active' : ''}" data-drpreset="${p.key}">${p.label}</button>`
        ).join('');
        const displayText =
          (drState.from ? fmtDR(drState.from) : '--') +
          ' – ' +
          (drState.to ? fmtDR(drState.to) : '--');
        el.className = 'dr-popup';
        el.innerHTML = `
    <div class="dr-presets">${presetHtml}</div>
    <div class="dr-cal-area">
      <div class="dr-cal-months">
        <div class="dr-cal-month"><div class="dr-cal-head"><button data-drnav="prev">‹</button><span class="month-label">${cal1.label}</span><span></span></div><div class="dr-cal-grid">${cal1.cells}</div></div>
        <div class="dr-cal-month"><div class="dr-cal-head"><span></span><span class="month-label">${cal2.label}</span><button data-drnav="next">›</button></div><div class="dr-cal-grid">${cal2.cells}</div></div>
      </div>
      <div class="dr-foot"><span class="dr-display">${displayText}</span><div class="dr-btns"><button class="btn btn-ghost" data-draction="cancel" style="padding:6px 14px;font-size:11px;">Cancel</button><button class="btn btn-gold" data-draction="apply" style="padding:6px 14px;font-size:11px;">Apply</button></div></div>
    </div>`;
        const anchor = document.querySelector(`th[data-col="${drState.col}"] .search-ic`);
        if (anchor) {
          const rect = anchor.getBoundingClientRect();
          el.style.position = 'fixed';
          el.style.top = Math.min(rect.bottom + 6, window.innerHeight - 400) + 'px';
          el.style.left = Math.max(10, Math.min(rect.left - 200, window.innerWidth - 620)) + 'px';
        } else {
          el.style.position = 'fixed';
          el.style.top = '100px';
          el.style.left = '200px';
        }
      }
    </script>
  </body>
</html>
