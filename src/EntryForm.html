<script>
/* ============================= ENTRY FORM ============================= */
function addRowA(){const E=S.entry[currentSegment()];E.rowsA.push(blankRowA());render();}
function addRowB(){const E=S.entry[currentSegment()];E.rowsB.push(blankRowB());render();}
function delRowA(i){const E=S.entry[currentSegment()];E.rowsA.splice(i,1);render();}
function delRowB(i){const E=S.entry[currentSegment()];E.rowsB.splice(i,1);render();}

function highlightErrors(seg){
  const E=S.entry[seg];
  document.querySelectorAll('.cell-error').forEach(el=>el.classList.remove('cell-error'));
  if(!E.date){const dp=document.querySelector('.flatpickr-alt')||document.getElementById('entryDate');if(dp){dp.classList.add('cell-error');dp.style.borderColor='#C4291C';dp.style.background='#FEF2F2';}}
  E.rowsA.forEach((r,i)=>{
    const any=r.code||r.userId||r.software||r.name||r.group||r.branchName||r.marginRMS!==""||r.marginAllocated!=="";
    if(!any)return;
    const row=document.querySelector(`tr[data-rowa="${i}"]`);if(!row)return;
    const markRed=function(el){if(el){el.classList.add('cell-error');el.style.borderColor='#C4291C';el.style.background='#FEF2F2';}};
    if(!r.code) markRed(row.querySelector('[data-a="code"]'));
    CASCADE_FIELDS.forEach(f=>{ if(!r[f]) markRed(row.querySelector(`[data-field="${f}"]`)); });
    if(r.marginRMS==="") markRed(row.querySelector('[data-a="marginRMS"]'));
    if(r.marginAllocated==="") markRed(row.querySelector('[data-a="marginAllocated"]'));
  });
  E.rowsB.forEach((r,i)=>{
    const any=r.group||r.margin!=="";if(!any)return;
    const rows=document.querySelectorAll('.entry-b tbody tr');const row=rows[i];if(!row)return;
    const markRed=function(el){if(el){el.classList.add('cell-error');el.style.borderColor='#C4291C';el.style.background='#FEF2F2';}};
    if(!r.group) markRed(row.querySelector('[data-b="group"]'));
    if(r.margin==="") markRed(row.querySelector('[data-b="margin"]'));
  });
}

function onEntryFieldInput(el){
  const seg=currentSegment();if(!seg)return;const E=S.entry[seg];
  const i=parseInt(el.getAttribute('data-i'),10);
  const aF=el.getAttribute('data-a'),bF=el.getAttribute('data-b');
  if(bF){
    E.rowsB[i][bF]=el.value;
    if(bF==='margin'&&el.value!==''&&parseFloat(el.value)<0){
      el.value='';E.rowsB[i][bF]='';showNegError(el);
    }
    return;
  }
  if(!aF)return;
  const r=E.rowsA[i];
  if(aF==='code'){
    r.code=el.value;
    CASCADE_FIELDS.forEach(f=>{r[f]="";});
    liveSyncRow(seg,i,'code');
    return;
  }
  if(CASCADE_FIELDS.indexOf(aF)!==-1){
    r[aF]=el.value;
    const idx=CASCADE_FIELDS.indexOf(aF);
    CASCADE_FIELDS.slice(idx+1).forEach(f=>{r[f]="";});
    liveSyncRow(seg,i,aF);
    return;
  }
  r[aF]=el.value;
  if((aF==='marginRMS'||aF==='marginAllocated')&&el.value!==''&&parseFloat(el.value)<0){
    el.value='';r[aF]='';showNegError(el);return;
  }
}


function renderEntry(seg){
  const E=S.entry[seg];
  const segLabel=seg==='commodity'?'Commodity':'Equity';
  const tblA=E.rowsA.map((r,i)=>{
    const info=resolveCascade(seg,r);
    const anyA=r.code||r.userId!==""||r.software||r.name||r.group||r.branchName||r.marginRMS!==""||r.marginAllocated!=="";
    const showE=E.showErrors&&anyA;
    const ec=cond=>(showE&&cond)?' cell-error':'';
    return `<tr data-rowa="${i}">
      <td class="rownum">${i+1}</td>
      <td><input type="text" class="${(showE&&!r.code)?'cell-error':''}" list="codelist" data-a="code" data-i="${i}" value="${esc(r.code)}" placeholder="Type code…" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" onblur="if(!this.value)this.setAttribute('readonly','')"></td>
      <td>${buildCascadeCellHtml('userId',i,r.userId,info.userId,showE&&!r.userId)}</td>
      <td>${buildCascadeCellHtml('software',i,r.software,info.software,showE&&!r.software)}</td>
      <td>${buildCascadeCellHtml('name',i,r.name,info.name,showE&&!r.name)}</td>
      <td>${buildCascadeCellHtml('group',i,r.group,info.group,showE&&!r.group)}</td>
      <td>${buildCascadeCellHtml('branchName',i,r.branchName,info.branchName,showE&&!r.branchName)}</td>
      <td><input class="num${ec(r.marginRMS==="")}" type="number" step="any" min="0" inputmode="decimal" data-a="marginRMS" data-i="${i}" value="${esc(r.marginRMS)}" placeholder=""></td>
      <td><input class="num${ec(r.marginAllocated==="")}" type="number" step="any" min="0" inputmode="decimal" data-a="marginAllocated" data-i="${i}" value="${esc(r.marginAllocated)}" placeholder=""></td>
      <td style="text-align:center;"><button class="trash-btn" data-action="del-a" data-i="${i}" title="Delete row">${trashIcon()}</button><div class="row-resize"></div></td>
    </tr>`;
  }).join("");

  const tblB=E.rowsB.map((r,i)=>{
    const anyB=r.group||r.margin!=="";
    const showEB=E.showErrors&&anyB;
    return `<tr>
      <td class="rownum">${i+1}</td>
      <td><input type="text" class="${(showEB&&!r.group)?'cell-error':''}" list="grouplist" data-b="group" data-i="${i}" value="${esc(r.group)}" placeholder="Select group…" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" onblur="if(!this.value)this.setAttribute('readonly','')"></td>
      <td><input class="num${(showEB&&r.margin==="")?' cell-error':''}" type="number" step="any" min="0" inputmode="decimal" data-b="margin" data-i="${i}" value="${esc(r.margin)}" placeholder=""></td>
      <td style="text-align:center;"><button class="trash-btn" data-action="del-b" data-i="${i}" title="Delete row">${trashIcon()}</button><div class="row-resize"></div></td>
    </tr>`;
  }).join("");

  const eCols=[
    {k:'num',label:'#',def:24,noResize:true},{k:'code',label:'Code',def:80},{k:'userId',label:'User ID',def:90},
    {k:'software',label:'Software',def:70},{k:'name',label:'Name',def:250},{k:'group',label:'Group',def:110},
    {k:'branchName',label:'Branch Name',def:110},{k:'marginRMS',label:'Margin RMS',def:85},{k:'marginAllocated',label:'Margin Alloc.',def:85},{k:'del',label:'',def:28,noResize:true}
  ];
  const eHdr=eCols.map(c=>{
    const w=S.entryWidths[c.k]||c.def;
    const handle=c.noResize?'':`<div class="eresize" data-ecol="${c.k}"></div>`;
    return `<th class="blk-a" style="width:${w}px;min-width:${w}px;max-width:${w}px;">${c.label}${handle}</th>`;
  }).join('');

  const mCount=masterFor(seg).length;
  return `
    <div class="entry-toolbar">
      <div class="date-field"><label>Date <span class="req-star">*</span></label><input type="text" id="entryDate" placeholder="DD-MMM-YYYY" value="${esc(E.date)}" autocomplete="off"></div>
      <span class="seg-badge ${seg}">${segLabel}</span>
      <span style="font-size:10px;color:var(--muted);">Master: ${mCount} rows${mCount?'':' — check MASTER '+segLabel.toUpperCase()+' tab'}</span>
      <div style="margin-left:auto;font-size:10px;color:var(--muted);">Saves to RESPONSES ${segLabel.toUpperCase()} & RESPONSES 2 ${segLabel.toUpperCase()}</div>
    </div>
    <div class="entry-panels">
      <div class="entry-panel entry-panel-main">
        <div class="panel-head">${segLabel} Margin Entry <span class="panel-count">${E.rowsA.length} rows</span></div>
        <div class="entry-scroll"><table class="entry" style="table-layout:fixed;"><thead><tr>${eHdr}</tr></thead><tbody>${tblA}</tbody></table></div>
        <div class="panel-foot">
          <button class="btn btn-ghost" data-action="add-a">+ Add Row</button>
          <button class="btn btn-gold" data-action="submit-entry" ${S.saving?'disabled':''}>${S.saving?'<span class="spinner" style="width:14px;height:14px;border-width:2px;"></span> Saving…':'Save All Entries'}</button>
          <span style="margin-left:auto;font-size:11px;color:var(--muted);">Saving as: <b style="color:var(--ink);">${esc(S.user.name)}</b></span>
        </div>
      </div>
      <div class="entry-panel entry-panel-side">
        <div class="panel-head">Group Margin <span class="panel-count">${E.rowsB.length} rows</span></div>
        <div class="entry-scroll"><table class="entry entry-b"><thead><tr>
          <th class="blk-b" style="width:28px;">#</th><th class="blk-b">Group Name</th><th class="blk-b">Group Margin</th><th class="blk-b" style="width:32px;"></th>
        </tr></thead><tbody>${tblB}</tbody></table></div>
        <div class="panel-foot"><button class="btn btn-ghost" data-action="add-b">+ Add Row</button></div>
      </div>
    </div>
    <datalist id="codelist">${uniqueCodes(seg).map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
    <datalist id="grouplist">${groupNamesList(seg).map(g=>`<option value="${esc(g)}">`).join("")}</datalist>`;
}


async function submitEntry(){
  const seg=currentSegment();if(!seg)return;const E=S.entry[seg];
  const dateVal=document.getElementById('entryDate')?.value||E.date;E.date=dateVal;
  const validA=[],validB=[];let errA=false,errB=false;
  E.rowsA.forEach(r=>{
    const any=r.code||r.userId||r.software||r.name||r.group||r.branchName||r.marginRMS!==""||r.marginAllocated!=="";
    if(!any)return;
    const ok=r.code&&r.userId!==""&&r.software&&r.name&&r.group&&r.branchName&&r.marginRMS!==""&&r.marginAllocated!=="";
    if(!ok){errA=true;return;}validA.push(r);
  });
  E.rowsB.forEach(r=>{
    const any=r.group||r.margin!=="";if(!any)return;
    if(!r.group||r.margin===""){errB=true;return;}validB.push(r);
  });

  const dateMissing = !dateVal&&(validA.length||validB.length||errA||errB);
  if(dateMissing||errA||errB){
    E.showErrors=true;
    render();
    return;
  }
  if(!validA.length&&!validB.length){return;}

  E.showErrors=false;
  const ts=fmtNow();const disp=fmtDateDisplay(dateVal);const loginName=S.user.name||S.user.id||'';
  const newA=validA.map(r=>({timestamp:ts,date:disp,code:r.code,userId:r.userId,software:r.software,name:r.name,group:r.group,marginRMS:r.marginRMS,marginAllocated:r.marginAllocated,branchName:r.branchName,loginName:loginName}));
  const newB=validB.map(r=>({timestamp:ts,date:disp,group:r.group,margin:r.margin,loginName:loginName}));

  S.saving=true;render();
  showSavingOverlay('Saving entries…');
  try{
    const result=await runServer('saveEntries',{segment:seg,responses1:newA,responses2:newB});
    S.saving=false;
    hideSavingOverlay();
    if(result.status!=='ok'){showToast("Save failed: "+(result.message||'unknown error'),true);return;}
    if(seg==='equity'){S.respEquity.push(...newA);S.resp2Equity.push(...newB);}
    else{S.respCommodity.push(...newA);S.resp2Commodity.push(...newB);}
    S.entry[seg]=freshSeg();
    showToast(`Saved ${result.savedA} entry row(s) and ${result.savedB} group row(s) to ${seg==='equity'?'Equity':'Commodity'} sheets.`,false);
  }catch(err){S.saving=false;hideSavingOverlay();showToast("Save failed: "+err.message,true);}
}
</script>
