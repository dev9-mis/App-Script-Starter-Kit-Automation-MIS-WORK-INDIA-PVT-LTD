<!-- ═══ MarginEntry.html — "Margin Entry" page (IT DETAILS section) ═══
     Same pattern as Backoffice.html but on the margin columns of RESPONSES-NEW
     (AP..AW). Pick a coded Unique No. → fill the yellow margin fields → Save.
       • First margin entry (AP blank): writes RESPONSES-NEW in place; INTRADAY
         is read-only NO.
       • Re-entry with INTRADAY=NO + changed values: goes to RESPONSES-MARGIN-ENTRY
         for approval (email).
       • Re-entry with INTRADAY=YES: goes to the INTRADAY YES tab (same-day active
         row is cancelled first).
     Never touches the Backoffice / IT Details flows. -->
<script>
  // Margin/back-office columns are resolved by FIXED SUBARRAY INDEX (their exact
  // position in RESPONSES-NEW), not by header text — so fills/saves can never
  // grab the wrong column. Rows are objects keyed by header, so we look up the
  // header name AT that position and use it as the key. 0-based:
  //   AN=39 Back Office Code · AP=41 Margin · AQ=42 SOV Equity · AR=43 SOV F&O ·
  //   AS=44 Total Prem · AT=45 MTM · AU=46 Slice · AV=47 RMS Remark · AW=48 Ts
  const MG_IDX_BOCODE = 39, MG_IDX_MARGIN = 41, MG_IDX_SOVEQ = 42, MG_IDX_SOVFO = 43,
    MG_IDX_PREM = 44, MG_IDX_MTM = 45, MG_IDX_SLICE = 46, MG_IDX_RMS = 47, MG_IDX_TS = 48;
  function mgKeyAt(idx) { return (S.itDetails.headers || [])[idx]; }
  function mgMarginHeader() { return mgKeyAt(MG_IDX_MARGIN); }
  function mgSovEqHeader() { return mgKeyAt(MG_IDX_SOVEQ); }
  function mgSovFoHeader() { return mgKeyAt(MG_IDX_SOVFO); }
  function mgPremHeader() { return mgKeyAt(MG_IDX_PREM); }
  function mgMtmHeader() { return mgKeyAt(MG_IDX_MTM); }
  function mgSliceHeader() { return mgKeyAt(MG_IDX_SLICE); }
  function mgRmsHeader() { return mgKeyAt(MG_IDX_RMS); }
  function mgTsHeader() { return mgKeyAt(MG_IDX_TS); }
  function mgBoCodeHeader() { return mgKeyAt(MG_IDX_BOCODE); }

  // ── Numeric margin inputs ──────────────────────────────────────────────
  // The user types freely; we SHOW the value Indian-grouped (12,10,541) for
  // readability but keep only the RAW number (1210541) in state and the sheet.
  // RMS Remark is the sole free-text field, so it's excluded here.
  const MG_NUMERIC_KEYS = ['margin', 'sovEquity', 'sovFno', 'totalPrem', 'mtm'];
  // Strip everything except digits and a single decimal point.
  function mgSanitizeNumber(s) {
    s = String(s == null ? '' : s).replace(/[^0-9.]/g, '');
    const dot = s.indexOf('.');
    if (dot > -1) s = s.slice(0, dot + 1) + s.slice(dot + 1).replace(/\./g, '');
    return s;
  }
  // Raw number -> Indian grouping (last 3 digits, then pairs): 1210541 -> 12,10,541.
  function mgFormatIndian(raw) {
    raw = mgSanitizeNumber(raw);
    if (raw === '' || raw === '.') return raw;
    const parts = raw.split('.');
    let intPart = parts[0].replace(/^0+(?=\d)/, '');
    if (intPart === '') intPart = '0';
    let grouped = intPart;
    if (intPart.length > 3) {
      grouped = intPart.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + intPart.slice(-3);
    }
    return parts.length > 1 ? grouped + '.' + parts[1] : grouped;
  }
  // Reformat an input in place, preserving the caret by ANCHORING FROM THE RIGHT:
  // we keep the same number of significant chars (digits + the decimal point) to
  // the caret's right. Commas are never significant, so grouping never shifts the
  // caret — and typing "." keeps the caret after the dot (not before it).
  // Returns the raw (comma-free) value to store in state. Called from Common.html.
  function mgReformatInput(el) {
    const rightSig = (el.value.slice(el.selectionStart).match(/[0-9.]/g) || []).length;
    const raw = mgSanitizeNumber(el.value);
    const formatted = mgFormatIndian(raw);
    el.value = formatted;
    let pos = formatted.length, seen = 0;
    while (pos > 0 && seen < rightSig) {
      pos--;
      if (formatted[pos] !== ',') seen++;
    }
    el.setSelectionRange(pos, pos);
    return raw;
  }

  const MG_COLS = [
    { key: 'date', label: 'Date', w: 92 },
    { key: 'status', label: 'Status', w: 78 },
    { key: 'unique', label: 'Unique No.', w: 90 },
    { key: 'userId', label: 'User ID', w: 90 },
    { key: 'name', label: 'User Name', w: 140 },
    { key: 'code', label: 'Back Office Code', w: 120 },
    { key: 'group', label: 'Group Name', w: 140 },
    { key: 'segment', label: 'Segment', w: 90 },
    { key: 'software', label: 'Software', w: 88 },
    { key: 'clientPro', label: 'Client/Pro', w: 90 },
    { key: 'serverIp', label: 'Server IP', w: 118 },
    { key: 'margin', label: 'Margin', w: 90 },
    { key: 'mtm', label: 'MTM', w: 80 },
    { key: 'rms', label: 'RMS Remark', w: 150 },
  ];
  const MG_PAGE_SIZES = [25, 50, 100];

  function ensureMgForm() {
    if (!S.mgForm) {
      S.mgForm = {
        picked: '',
        intraday: 'NO',
        margin: '', sovEquity: '', sovFno: '', totalPrem: '', mtm: '', slice: '', rms: '',
        saving: false, error: '', showErrors: false,
        uOpen: false, uQuery: '',
        userFilter: '', fOpen: false, fQuery: '',
        search: {}, searchOpen: '', globalQuery: '',
        page: 1, pageSize: 50,
      };
    }
    return S.mgForm;
  }

  function mgRowCols(r) {
    return {
      date: String(r[resolveItHeader(['TIMESTAMP', 'DATE'])] || '').split(' ')[0],
      status: String(r[itStatusHeader()] || ''),
      unique: String(r[itUniqueNoHeader()] || ''),
      userId: String(r[resolveItHeader(['USER ID'])] || ''),
      name: String(r[resolveItHeader(['USER NAME'])] || ''),
      code: String(r[mgBoCodeHeader()] || ''),
      group: String(r[resolveItHeader(['GROUP NAME'])] || ''),
      segment: String(r[resolveItHeader(['SEGMENT', 'SEGEMNT'])] || ''),
      software: String(r[resolveItHeader(['SOFTWARE'])] || ''),
      clientPro: String(r[resolveItHeader(['CLIENT/PRO', 'CLIENT PRO', 'CLIENTPRO'])] || ''),
      serverIp: String(r[resolveItHeader(['SERVER IP'])] || ''),
      margin: String(r[mgMarginHeader()] || ''),
      mtm: String(r[mgMtmHeader()] || ''),
      rms: String(r[mgRmsHeader()] || ''),
    };
  }

  function mgActiveRecords() {
    const statusH = itStatusHeader(), uniqueH = itUniqueNoHeader(), userIdH = resolveItHeader(['USER ID']);
    return (S.itDetails.rows || []).filter(
      (r) =>
        String(r[statusH] || '').trim().toUpperCase() === 'ACTIVE' &&
        String(r[uniqueH] || '').trim() &&
        String(r[userIdH] || '').trim()
    );
  }
  // Records that already have a Back Office Code (AN not blank). Margin entry is
  // the step AFTER backoffice, so the form + table work only on coded records.
  function mgCodedRecords() {
    const codeH = mgBoCodeHeader();
    return mgActiveRecords().filter((r) => String(r[codeH] || '').trim());
  }
  // Form dropdown: only Unique Nos. whose Back Office Code is done.
  function mgFormPickRows() { return mgCodedRecords(); }

  // Default table = coded (AN filled) + Margin (AP) still blank (the pending list).
  // When a User ID is chosen, show ALL that user's CODED records — margin done or
  // not — but never uncoded ones (those belong to Backoffice, not Margin).
  function mgTableRows() {
    const F = ensureMgForm();
    const userIdH = resolveItHeader(['USER ID']), marginH = mgMarginHeader();
    if (F.userFilter) {
      const t = F.userFilter.trim().toUpperCase();
      return mgCodedRecords().filter((r) => String(r[userIdH] || '').trim().toUpperCase() === t);
    }
    return mgCodedRecords().filter((r) => !String(r[marginH] || '').trim());
  }

  // User IDs that have at least one coded record (so the filter only lists relevant users).
  function mgUserIds() {
    const userIdH = resolveItHeader(['USER ID']);
    const seen = {}, out = [];
    mgCodedRecords().forEach((r) => {
      const id = String(r[userIdH] || '').trim();
      if (id && !seen[id.toUpperCase()]) { seen[id.toUpperCase()] = true; out.push(id); }
    });
    return out.sort();
  }
  function mgRecordByUnique(u) {
    const uniqueH = itUniqueNoHeader();
    return mgCodedRecords().find((r) => String(r[uniqueH]).trim() === String(u).trim()) || null;
  }
  // Whether INTRADAY is editable (a first margin already exists on the record).
  function mgIntradayEditable(rec) {
    return !!(rec && String(rec[mgMarginHeader()] || '').trim());
  }

  /* ---------------- form ---------------- */
  function onMgPickUnique(u) {
    const F = ensureMgForm();
    const rec = mgRecordByUnique(u);
    if (!rec) return;
    F.picked = u;
    F.uOpen = false;
    F.showErrors = false;
    F.error = '';
    F.margin = mgSanitizeNumber(rec[mgMarginHeader()]);
    F.sovEquity = mgSanitizeNumber(rec[mgSovEqHeader()]);
    F.sovFno = mgSanitizeNumber(rec[mgSovFoHeader()]);
    F.totalPrem = mgSanitizeNumber(rec[mgPremHeader()]);
    F.mtm = mgSanitizeNumber(rec[mgMtmHeader()]);
    const sl = String(rec[mgSliceHeader()] || '').trim().toUpperCase();
    F.slice = sl === 'YES' || sl === 'NO' ? sl : ''; // Slice Allowed is now YES/NO
    F.rms = String(rec[mgRmsHeader()] || '');
    F.intraday = 'NO';
    render();
  }
  function mgClear() {
    const F = ensureMgForm();
    F.picked = '';
    F.intraday = 'NO';
    F.margin = F.sovEquity = F.sovFno = F.totalPrem = F.mtm = F.slice = F.rms = '';
    F.uOpen = false;
    F.showErrors = false;
    F.error = '';
    render();
  }
  function onMgUToggle() {
    const F = ensureMgForm();
    F.uOpen = !F.uOpen; F.uQuery = '';
    render();
    if (F.uOpen) { const i = document.querySelector('.sp-wrap[data-mgu="1"] .sp-search'); if (i) i.focus(); }
  }
  function onMgPickUser(uid) { const F = ensureMgForm(); F.userFilter = uid; F.fOpen = false; F.page = 1; render(); }
  function onMgUserClear() { const F = ensureMgForm(); F.userFilter = ''; F.fOpen = false; F.page = 1; render(); }
  function onMgFToggle() {
    const F = ensureMgForm();
    F.fOpen = !F.fOpen; F.fQuery = '';
    render();
    if (F.fOpen) { const i = document.querySelector('.sp-wrap[data-mgf="1"] .sp-search'); if (i) i.focus(); }
  }

  /* ---------------- table search + pagination ---------------- */
  function onMgToggleSearch(colKey) {
    const F = ensureMgForm();
    if (F.searchOpen === colKey) {
      F.searchOpen = '';
      if (F.search[colKey]) { delete F.search[colKey]; F.page = 1; }
    } else F.searchOpen = colKey;
    render();
    if (F.searchOpen === colKey) {
      const inp = document.querySelector(`.bo-table input[data-action="mg-colsearch"][data-mgcol="${colKey}"]`);
      if (inp) inp.focus();
    }
  }
  function onMgPage(dir) {
    const F = ensureMgForm();
    const size = F.pageSize || 50;
    const pages = Math.max(1, Math.ceil(mgFilteredRows().length / size));
    let p = F.page || 1;
    if (dir === 'first') p = 1; else if (dir === 'prev') p = Math.max(1, p - 1);
    else if (dir === 'next') p = Math.min(pages, p + 1); else if (dir === 'last') p = pages;
    F.page = p; render();
  }
  function onMgPageSize(n) { const F = ensureMgForm(); F.pageSize = parseInt(n, 10) || 50; F.page = 1; render(); }
  function onMgGlobalClear() { const F = ensureMgForm(); F.globalQuery = ''; F.page = 1; render(); }

  /* ---------------- save ---------------- */
  function applyMgSaveLocal(res) {
    const statusH = itStatusHeader(), uniqueH = itUniqueNoHeader();
    const row = (S.itDetails.rows || []).find(
      (r) => String(r[uniqueH] || '').trim() === String(res.uniqueNo).trim() &&
        String(r[statusH] || '').trim().toUpperCase() === 'ACTIVE'
    );
    if (!row) return;
    const v = res.values || [];
    const set = (h, val) => { if (h) row[h] = val; };
    set(mgMarginHeader(), v[0]); set(mgSovEqHeader(), v[1]); set(mgSovFoHeader(), v[2]);
    set(mgPremHeader(), v[3]); set(mgMtmHeader(), v[4]); set(mgSliceHeader(), v[5]);
    set(mgRmsHeader(), v[6]); set(mgTsHeader(), res.timestamp);
  }

  async function saveMarginForm() {
    const F = ensureMgForm();
    if (F.saving) return;
    if (!F.picked) { F.error = 'Choose a Unique No. to update first.'; render(); return; }
    if (!String(F.margin || '').trim() || (F.slice !== 'YES' && F.slice !== 'NO')) {
      F.showErrors = true;
      F.error = !String(F.margin || '').trim() ? 'Margin is required.' : 'Select Slice Allowed (Yes or No).';
      render();
      return;
    }
    F.error = ''; F.saving = true; render();
    showSavingOverlay('Saving Margin Entry…');
    try {
      const res = await runServer('saveMarginEntry', {
        uniqueNo: F.picked,
        intraday: F.intraday,
        margin: F.margin, sovEquity: F.sovEquity, sovFno: F.sovFno,
        totalPrem: F.totalPrem, mtm: F.mtm, slice: F.slice, rms: F.rms,
        loginId: S.user.id,
      });
      hideSavingOverlay();
      if (res && res.status === 'nochange') { F.saving = false; showToast(res.message || 'Nothing to update.', true); render(); return; }
      if (res && res.status === 'duplicate') { F.saving = false; showToast(res.message || 'Already pending approval.', true); render(); return; }
      if (!res || res.status !== 'ok') { F.saving = false; F.error = (res && res.message) || 'Save failed.'; render(); return; }

      if (res.mode === 'approval') {
        showToast(
          res.emailWarning ? 'Sent for approval (email failed: ' + res.emailWarning + ')' : 'Margin change sent for approval.',
          !!res.emailWarning
        );
      } else if (res.mode === 'intraday') {
        const base = res.cancelled ? 'Intraday saved (previous same-day entry cancelled).' : 'Intraday margin saved.';
        showToast(res.emailWarning ? base + ' Email failed: ' + res.emailWarning : base, !!res.emailWarning);
      } else {
        applyMgSaveLocal(res);
        showToast('Margin saved.', false);
      }
      F.saving = false;
      mgClear();
    } catch (err) {
      hideSavingOverlay(); F.saving = false; F.error = err.message; render();
    }
  }

  /* ============================= RENDER ============================= */
  function renderMgUniquePicker() {
    const F = ensureMgForm();
    const uniqueH = itUniqueNoHeader();
    const all = mgFormPickRows();
    const query = F.uOpen ? F.uQuery || '' : '';
    const filtered = query ? all.filter((r) => String(r[uniqueH] || '').toLowerCase().includes(query.toLowerCase())) : all;
    return `<div class="sp-wrap" data-mgu="1">
      <button type="button" class="sp-trigger" data-action="mg-utoggle">
        ${F.picked ? `<span class="sp-trigger-label">${esc(F.picked)}</span>` : `<span class="sp-placeholder">Choose Unique No…</span>`}
        ${F.picked ? `<span class="sp-clear" data-action="mg-uclear" title="Clear">✕</span>` : ''}
        <span class="sp-caret">▾</span>
      </button>
      ${F.uOpen ? `<div class="sp-panel">
        <input type="text" class="sp-search" data-action="mg-usearch" placeholder="Search Unique No…" value="${esc(query)}">
        <div class="sp-options">${filtered.length ? filtered.map((r) => `<div class="sp-option ${F.picked === String(r[uniqueH]) ? 'selected' : ''}" data-action="mg-uchoose" data-unique="${esc(r[uniqueH])}"><span class="sp-check">${F.picked === String(r[uniqueH]) ? '✓' : ''}</span>${esc(r[uniqueH])}</div>`).join('') : '<div class="sp-empty">No coded records</div>'}</div>
      </div>` : ''}
    </div>`;
  }
  function renderMgUserPicker() {
    const F = ensureMgForm();
    const users = mgUserIds();
    const query = F.fOpen ? F.fQuery || '' : '';
    const filtered = query ? users.filter((u) => u.toLowerCase().includes(query.toLowerCase())) : users;
    return `<div class="sp-wrap" data-mgf="1">
      <button type="button" class="sp-trigger" data-action="mg-ftoggle">
        ${F.userFilter ? `<span class="sp-trigger-label">${esc(F.userFilter)}</span>` : `<span class="sp-placeholder">All pending · filter User ID</span>`}
        ${F.userFilter ? `<span class="sp-clear" data-action="mg-fclear" title="Clear">✕</span>` : ''}
        <span class="sp-caret">▾</span>
      </button>
      ${F.fOpen ? `<div class="sp-panel">
        <input type="text" class="sp-search" data-action="mg-fsearch" placeholder="Search User ID…" value="${esc(query)}">
        <div class="sp-options">${filtered.length ? filtered.map((u) => `<div class="sp-option ${F.userFilter === u ? 'selected' : ''}" data-action="mg-fchoose" data-uid="${esc(u)}"><span class="sp-check">${F.userFilter === u ? '✓' : ''}</span>${esc(u)}</div>`).join('') : '<div class="sp-empty">No matches</div>'}</div>
      </div>` : ''}
    </div>`;
  }

  function renderMgForm() {
    const F = ensureMgForm();
    const rec = F.picked ? mgRecordByUnique(F.picked) : null;
    const disp = (aliases) => (rec ? esc(rec[resolveItHeader(aliases)] || '—') : '—');
    const dis = F.picked ? '' : 'disabled';
    const marginErr = F.showErrors && !String(F.margin || '').trim() ? 'cell-error' : '';
    const sliceErr = F.showErrors && F.slice !== 'YES' && F.slice !== 'NO' ? 'cell-error' : '';
    const canIntraday = mgIntradayEditable(rec);
    const intradayCell = canIntraday
      ? `<select class="mg-intraday" data-mg="intraday" ${dis}>
           <option value="NO" ${F.intraday === 'NO' ? 'selected' : ''}>NO</option>
           <option value="YES" ${F.intraday === 'YES' ? 'selected' : ''}>YES</option>
         </select>`
      : `<div class="cell-ro">NO</div>`;
    const yInput = (key, label, val, ph) =>
      `<div class="itf-cell bo-edit"><label>${label}</label><input type="text" data-mg="${key}" value="${esc(val)}" placeholder="${esc(ph || '')}" autocomplete="off" ${dis}></div>`;
    return `<div class="itform-page bo-topcard">
      <div class="itform-head"><h2>Margin Entry</h2>${F.error ? `<span class="bo-headerr">${esc(F.error)}</span>` : ''}</div>
      <div class="bo-formbar">
        <div class="bo-left mg-grid">
          <div class="itf-cell"><label>Unique No. <span class="req-star">*</span></label>${renderMgUniquePicker()}</div>
          <div class="itf-cell"><label>User ID</label><div class="cell-ro">${disp(['USER ID'])}</div></div>
          <div class="itf-cell"><label>User Name</label><div class="cell-ro">${disp(['USER NAME'])}</div></div>
          <div class="itf-cell bo-edit"><label>Intraday</label>${intradayCell}</div>
          <div class="itf-cell"><label>Back Office Code</label><div class="cell-ro">${disp(['BACK OFFICE CODE', 'BACKOFFICE CODE'])}</div></div>
          <div class="itf-cell"><label>Group Name</label><div class="cell-ro">${disp(['GROUP NAME'])}</div></div>
          <div class="itf-cell"><label>Segment</label><div class="cell-ro">${disp(['SEGMENT', 'SEGEMNT'])}</div></div>
          <div class="itf-cell"><label>Software</label><div class="cell-ro">${disp(['SOFTWARE'])}</div></div>
          <div class="itf-cell"><label>Client/Pro</label><div class="cell-ro">${disp(['CLIENT/PRO', 'CLIENT PRO', 'CLIENTPRO'])}</div></div>
          <div class="itf-cell"><label>Exchange</label><div class="cell-ro">${disp(['EXCHANGE ALLOWED IN ID', 'EXCHANGE'])}</div></div>
          ${yInput('margin', 'Margin <span class="req-star">*</span> <span class="mg-unit">(in lakhs)</span>', mgFormatIndian(F.margin), 'e.g. 12,10,541').replace('<input type="text"', `<input type="text" inputmode="decimal" class="${marginErr}"`)}
          ${yInput('sovEquity', 'S.O. Value Equity <span class="mg-unit">(in lakhs)</span>', mgFormatIndian(F.sovEquity), 'Enter equity value').replace('<input type="text"', '<input type="text" inputmode="decimal"')}
          ${yInput('sovFno', 'S.O. Value F&O <span class="mg-unit">(in lakhs)</span>', mgFormatIndian(F.sovFno), 'Enter F&O value').replace('<input type="text"', '<input type="text" inputmode="decimal"')}
          ${yInput('totalPrem', 'Total Prem Buy', mgFormatIndian(F.totalPrem), 'Enter total prem buy').replace('<input type="text"', '<input type="text" inputmode="decimal"')}
          ${yInput('mtm', 'MTM', mgFormatIndian(F.mtm), 'Enter MTM').replace('<input type="text"', '<input type="text" inputmode="decimal"')}
          <div class="itf-cell bo-edit"><label>Slice Allowed <span class="req-star">*</span></label>
            <select class="${sliceErr}" data-mg="slice" ${dis}>
              <option value="" ${!F.slice ? 'selected' : ''}>Select…</option>
              <option value="YES" ${F.slice === 'YES' ? 'selected' : ''}>YES</option>
              <option value="NO" ${F.slice === 'NO' ? 'selected' : ''}>NO</option>
            </select>
          </div>
          <div class="itf-cell bo-edit mg-rms"><label>RMS Remark</label><textarea data-mg="rms" placeholder="Enter remark (optional)" ${dis}>${esc(F.rms)}</textarea></div>
        </div>
      </div>
      <div class="bo-actions">
        <button class="btn btn-ghost" data-action="mg-clear" ${F.picked ? '' : 'disabled'}>Clear</button>
        <button class="btn btn-gold" data-action="mg-save" ${F.saving || !F.picked ? 'disabled' : ''}>${F.saving ? '<span class="spinner" style="width:14px;height:14px;border-width:2px;"></span> Saving…' : 'Save'}</button>
      </div>
    </div>`;
  }

  function mgFilteredRows() {
    const F = ensureMgForm();
    const search = F.search || {};
    const g = String(F.globalQuery || '').trim().toLowerCase();
    return mgTableRows()
      .map((r) => ({ c: mgRowCols(r), uni: String(r[itUniqueNoHeader()] || '') }))
      .filter((o) => !g || MG_COLS.some((col) => String(o.c[col.key] || '').toLowerCase().includes(g)))
      .filter((o) => MG_COLS.every((col) => {
        const q = String(search[col.key] || '').trim().toLowerCase();
        return !q || String(o.c[col.key] || '').toLowerCase().includes(q);
      }));
  }

  function renderMgTable() {
    const F = ensureMgForm();
    const all = mgFilteredRows();
    const total = all.length;
    const size = F.pageSize || 50;
    const pages = Math.max(1, Math.ceil(total / size));
    const page = Math.min(Math.max(1, F.page || 1), pages);
    F.page = page;
    const start = (page - 1) * size;
    const slice = all.slice(start, start + size);

    const head =
      '<tr><th class="bo-sr"><div class="th-inner"><div class="th-row"><span class="th-label" style="cursor:default;">#</span></div></div></th>' +
      MG_COLS.map((c) => {
        const open = F.searchOpen === c.key;
        const filterHtml = open ? `<div class="th-filter"><input type="text" data-action="mg-colsearch" data-mgcol="${c.key}" value="${esc(F.search[c.key] || '')}" placeholder="Filter ${esc(c.label)}…"></div>` : '';
        return `<th style="min-width:${c.w}px"><div class="th-inner"><div class="th-row"><span class="th-label">${esc(c.label)}</span><span class="search-ic ${open ? 'on' : ''} ${F.search[c.key] ? 'on' : ''}" data-action="mg-togglesearch" data-mgcol="${c.key}" title="Search ${esc(c.label)}">⌕</span></div>${filterHtml}</div></th>`;
      }).join('') + '</tr>';

    const body = slice.length
      ? slice.map((o, i) => {
          const active = F.picked === o.uni ? 'bo-row-active' : '';
          return `<tr class="${active}" data-action="mg-row" data-unique="${esc(o.uni)}"><td class="bo-sr">${start + i + 1}</td>` +
            MG_COLS.map((col) => `<td>${esc(o.c[col.key] || '')}</td>`).join('') + '</tr>';
        }).join('')
      : `<tr><td colspan="${MG_COLS.length + 1}" class="bo-empty">${
          F.globalQuery || Object.keys(F.search).some((k) => F.search[k])
            ? 'No rows match your search.'
            : F.userFilter ? 'No coded records for this User ID.' : 'Nothing pending — all coded records have a margin.'
        }</td></tr>`;

    const first = total ? start + 1 : 0;
    const last = Math.min(start + size, total);
    const foot = `<div class="bo-foot">
      <div class="bo-foot-info">${first}–${last} of ${total}</div>
      <div class="bo-foot-size">Rows:
        <select class="bo-pagesize" data-action="mg-pagesize">${MG_PAGE_SIZES.map((n) => `<option value="${n}" ${n === size ? 'selected' : ''}>${n}</option>`).join('')}</select>
      </div>
      <div class="bo-foot-nav">
        <button class="bo-pg" data-action="mg-page" data-pg="first" ${page <= 1 ? 'disabled' : ''}>«</button>
        <button class="bo-pg" data-action="mg-page" data-pg="prev" ${page <= 1 ? 'disabled' : ''}>‹</button>
        <span class="bo-foot-page">${page} / ${pages}</span>
        <button class="bo-pg" data-action="mg-page" data-pg="next" ${page >= pages ? 'disabled' : ''}>›</button>
        <button class="bo-pg" data-action="mg-page" data-pg="last" ${page >= pages ? 'disabled' : ''}>»</button>
      </div>
    </div>`;

    const g = F.globalQuery || '';
    return `<div class="itform-page bo-tablecard">
      <div class="itform-head bo-thead">
        <div class="bo-thead-left">
          <h2 class="bo-thead-title">Records <span class="bo-count">${total}</span></h2>
          <div class="itreg-picker">${renderMgUserPicker()}</div>
        </div>
        <div class="bo-gsearch">
          <span class="bo-gsearch-ic">⌕</span>
          <input type="text" data-action="mg-globalsearch" value="${esc(g)}" placeholder="Search any column…">
          ${g ? '<span class="bo-gsearch-clear" data-action="mg-globalclear" title="Clear">✕</span>' : ''}
        </div>
      </div>
      <div class="bo-tablewrap"><table class="bo-table"><thead>${head}</thead><tbody>${body}</tbody></table></div>
      ${foot}
    </div>`;
  }

  function renderMarginEntry() {
    ensureMgForm();
    if (!S.itDetails.loaded && !S.itDetails.error) {
      return `<div class="empty-state" style="padding-top:80px;"><div class="spinner" style="margin:0 auto 16px;"></div><div class="big">Loading…</div></div>`;
    }
    if (S.itDetails.error) {
      return `<div class="empty-state"><div class="big">Could not load records</div>${esc(S.itDetails.error)}<div style="margin-top:14px;"><button class="btn btn-gold" data-action="itdetails-refresh">Retry</button></div></div>`;
    }
    return `<div class="bo-page">${renderMgForm()}${renderMgTable()}</div>`;
  }
</script>
