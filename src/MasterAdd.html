<script>
  /* ============================= MASTER "+ ADD" POPUP ============================= */
  const MASTER_ADD_FIELDS = [
    { k: 'code', label: 'Code' },
    { k: 'userId', label: 'User ID' },
    { k: 'software', label: 'Software' },
    { k: 'name', label: 'Name' },
    { k: 'group', label: 'Group Name' },
    { k: 'branchName', label: 'Branch Name' },
  ];
  function openMasterAdd(seg) {
    S.masterAdd = {
      seg,
      code: '',
      userId: '',
      software: '',
      name: '',
      group: '',
      branchName: '',
      error: '',
      saving: false,
      showErrors: false,
    };
    const html = renderMasterAddModal();
    if (html) {
      let container = document.getElementById('masterAddContainer');
      if (!container) {
        container = document.createElement('div');
        container.id = 'masterAddContainer';
        document.body.appendChild(container);
      }
      container.innerHTML = html;
    }
  }
  function closeMasterAdd() {
    S.masterAdd = null;
    const container = document.getElementById('masterAddContainer');
    if (container) container.innerHTML = '';
  }
  function masterAddOptions(seg, field) {
    const rows = seg === 'commodity' ? S.masterCommodity : S.masterEquity;
    return Array.from(new Set(rows.map((r) => r[field]).filter(Boolean))).sort();
  }
  function onMasterAddInput(el) {
    if (!S.masterAdd) return;
    const f = el.getAttribute('data-madd');
    if (!f) return;
    S.masterAdd[f] = el.value;
    if (el.classList.contains('cell-error') && el.value) el.classList.remove('cell-error');
  }
  function renderMasterAddModal() {
    const M = S.masterAdd;
    if (!M) return '';
    const segLabel = M.seg === 'commodity' ? 'Commodity' : 'Equity';
    const fieldsHtml = MASTER_ADD_FIELDS.map((f) => {
      const opts = masterAddOptions(M.seg, f.k);
      const listId = `madd-${f.k}`;
      const isErr = M.showErrors && !String(M[f.k] || '').trim();
      return `<div class="field">
      <label>${f.label} <span class="req-star">*</span></label>
      <input type="text" class="${isErr ? 'cell-error' : ''}" data-madd="${f.k}" list="${listId}" value="${esc(M[f.k])}" placeholder="Select or type ${esc(f.label.toLowerCase())}…" autocomplete="off">
      <datalist id="${listId}">${opts.map((o) => `<option value="${esc(o)}">`).join('')}</datalist>
    </div>`;
    }).join('');
    return `<div class="modal-overlay" data-action="master-add-overlay">
    <div class="modal-card">
      <div class="modal-head"><h3>Add Master Entry <span class="seg-badge ${M.seg}">${segLabel}</span></h3><button class="modal-close" data-action="close-master-add">✕</button></div>
      <div class="modal-body">
        ${M.error ? `<div class="modal-error">${esc(M.error)}</div>` : ''}
        ${fieldsHtml}
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-action="close-master-add">Cancel</button>
        <button class="btn btn-gold" data-action="save-master-add" ${M.saving ? 'disabled' : ''}>${M.saving ? '<span class="spinner" style="width:14px;height:14px;border-width:2px;"></span> Saving…' : 'Save'}</button>
      </div>
    </div>
  </div>`;
  }
  function rerenderModal() {
    const container = document.getElementById('masterAddContainer');
    if (!container) return;
    const html = renderMasterAddModal();
    container.innerHTML = html || '';
  }

  async function saveMasterAdd() {
    const M = S.masterAdd;
    if (!M) return;
    const missing = MASTER_ADD_FIELDS.some((f) => !String(M[f.k] || '').trim());
    if (missing) {
      M.showErrors = true;
      M.error = 'Sabhi 6 fields bharna zaroori hai.';
      rerenderModal();
      return;
    }
    M.error = '';
    M.saving = true;
    rerenderModal();
    showSavingOverlay('Saving master entry…');
    try {
      const result = await runServer('addMasterEntry', {
        segment: M.seg,
        code: M.code,
        userId: M.userId,
        software: M.software,
        name: M.name,
        group: M.group,
        branchName: M.branchName,
        loginId: S.user.id,
      });
      hideSavingOverlay();
      if (result.status !== 'ok') {
        M.saving = false;
        M.error = result.message || 'Save failed.';
        rerenderModal();
        return;
      }
      if (M.seg === 'commodity') S.masterCommodity.push(result.row);
      else S.masterEquity.push(result.row);
      closeMasterAdd();
      render();
      showToast('Master entry added successfully.', false);
    } catch (err) {
      hideSavingOverlay();
      M.saving = false;
      M.error = err.message;
      rerenderModal();
    }
  }
</script>
