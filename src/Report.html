<script>
  /* ============================= REPORT ============================= */
  const MONTH_NAMES = [
    'Jan',
    'Feb',
    'Mar',
    'Apr',
    'May',
    'Jun',
    'Jul',
    'Aug',
    'Sep',
    'Oct',
    'Nov',
    'Dec',
  ];
  const MONTH_FULL = [
    'January',
    'February',
    'March',
    'April',
    'May',
    'June',
    'July',
    'August',
    'September',
    'October',
    'November',
    'December',
  ];

  function renderReport(seg) {
    const segLabel = seg === 'commodity' ? 'Commodity' : 'Equity';
    const data = seg === 'commodity' ? S.respCommodity : S.respEquity;
    const resp2Data = seg === 'commodity' ? S.resp2Commodity : S.resp2Equity;
    const R = S.report;
    const numMonths = 4;

    let groups = {};
    data.forEach((row) => {
      const key = `${row.code}|||${row.userId}|||${row.software}|||${row.name}|||${row.group}`;
      if (!groups[key])
        groups[key] = {
          code: row.code,
          userId: row.userId,
          software: row.software,
          name: row.name,
          group: row.group,
          branchName: row.branchName || '',
          entries: [],
        };
      groups[key].entries.push(row);
      // Keep branchName from latest entry if available
      if (row.branchName && !groups[key].branchName) groups[key].branchName = row.branchName;
    });

    // Build a lookup of resp2 entries indexed by group name for quick access
    let resp2ByGroup = {};
    resp2Data.forEach((row) => {
      const g = row.group || '';
      if (!resp2ByGroup[g]) resp2ByGroup[g] = [];
      resp2ByGroup[g].push(row);
    });

    const months = [];
    for (let i = 0; i < numMonths; i++) {
      let m = R.month + i,
        y = R.year;
      while (m > 11) {
        m -= 12;
        y++;
      }
      months.push({ m, y, label: `${MONTH_NAMES[m]} ${y}` });
    }

    let groupList = Object.values(groups);

    if (R.search) {
      const q = R.search.toLowerCase();
      groupList = groupList.filter(
        (g) =>
          g.code.toLowerCase().includes(q) ||
          g.userId.toLowerCase().includes(q) ||
          g.software.toLowerCase().includes(q) ||
          g.name.toLowerCase().includes(q) ||
          g.group.toLowerCase().includes(q) ||
          g.branchName.toLowerCase().includes(q)
      );
    }

    groupList.forEach((g) => {
      g._hasData = months.some((mo) =>
        g.entries.some((e) => {
          const d = parseDT(e.timestamp) || parseDT(e.date);
          if (!d) return false;
          const dt = new Date(d);
          return dt.getMonth() === mo.m && dt.getFullYear() === mo.y;
        })
      );
    });

    if (R.filter === 'change') groupList = groupList.filter((g) => g._hasData);
    else if (R.filter === 'nochange') groupList = groupList.filter((g) => !g._hasData);

    if (R.sort) {
      const key = R.sort;
      const dir = R.sortDir;
      groupList.sort((a, b) => {
        let x = (a[key] || '').toLowerCase(),
          y = (b[key] || '').toLowerCase();
        if (x < y) return -1 * dir;
        if (x > y) return 1 * dir;
        return 0;
      });
    }

    const RPT_FIXED_COLS = [
      { k: 'code', l: 'Code', def: 90 },
      { k: 'userId', l: 'User ID', def: 90 },
      { k: 'software', l: 'Software', def: 80 },
      { k: 'name', l: 'Name', def: 200 },
      { k: 'group', l: 'Group Name', def: 120 },
      { k: 'branchName', l: 'Branch Name', def: 110, last: true },
    ];
    const fixedHdr =
      `<th class="rpt-th-fixed" rowspan="2" style="cursor:default;width:32px;min-width:32px;">S.No</th>` +
      RPT_FIXED_COLS.map((c) => {
        const si = R.sort === c.k ? (R.sortDir === 1 ? '▲' : '▼') : '';
        const w = R.widths[c.k] || c.def;
        return `<th class="rpt-th-fixed${c.last ? ' rpt-group-end' : ''}" rowspan="2" data-action="rpt-sort" data-col="${c.k}" style="width:${w}px;">${c.l}<span class="sort-ic">${si}</span><div class="th-search"><input type="text" placeholder="Filter…" data-action="rpt-search" data-col="${c.k}" value="${esc(R['f_' + c.k] || '')}" onclick="event.stopPropagation()"></div><div class="rpt-resize" data-action="rpt-resize" data-col="${c.k}"></div></th>`;
      }).join('');
    const monthHdrRow1 = months
      .map((mo, mi) => {
        const bc = mi > 0 ? ' rpt-month-border' : '';
        return `<th class="rpt-th-month-top${bc}" colspan="4">${mo.label}</th>`;
      })
      .join('');
    const monthHdrRow2 = months
      .map((mo, mi) => {
        const rmsSort = R.monthSort === `rms_${mi}` ? (R.monthSortDir === 1 ? ' ▲' : ' ▼') : '';
        const allocSort = R.monthSort === `alloc_${mi}` ? (R.monthSortDir === 1 ? ' ▲' : ' ▼') : '';
        const bc = mi > 0 ? ' rpt-month-border' : '';
        const wDate = R.widths[`date_${mi}`] || 80;
        const wRms = R.widths[`rms_${mi}`] || 80;
        const wAlloc = R.widths[`alloc_${mi}`] || 80;
        const wGrpM = R.widths[`grpm_${mi}`] || 120;
        return `<th class="rpt-th-month-sub${bc}" style="width:${wDate}px;">Date<div class="rpt-resize" data-action="rpt-resize" data-col="date_${mi}"></div></th><th class="rpt-th-month-sub" style="width:${wRms}px;" data-action="rpt-sort-month" data-col="rms_${mi}">Margin RMS${rmsSort}<div class="rpt-resize" data-action="rpt-resize" data-col="rms_${mi}"></div></th><th class="rpt-th-month-sub" style="width:${wAlloc}px;" data-action="rpt-sort-month" data-col="alloc_${mi}">Margin ON ID${allocSort}<div class="rpt-resize" data-action="rpt-resize" data-col="alloc_${mi}"></div></th><th class="rpt-th-month-sub" style="width:${wGrpM}px;">Group Margin<div class="rpt-resize" data-action="rpt-resize" data-col="grpm_${mi}"></div></th>`;
      })
      .join('');

    RPT_FIXED_COLS.forEach((c) => {
      const fv = R['f_' + c.k];
      if (fv) {
        const q = fv.toLowerCase();
        groupList = groupList.filter((g) => (g[c.k] || '').toLowerCase().includes(q));
      }
    });

    if (R.monthSort) {
      const parts = R.monthSort.split('_');
      const type = parts[0];
      const mi = parseInt(parts[1], 10);
      const mo = months[mi];
      if (mo) {
        const field = type === 'rms' ? 'marginRMS' : 'marginAllocated';
        groupList.sort((a, b) => {
          const getVal = (g) => {
            const mEntries = g.entries.filter((e) => {
              const d = parseDT(e.timestamp) || parseDT(e.date);
              if (!d) return false;
              const dt = new Date(d);
              return dt.getMonth() === mo.m && dt.getFullYear() === mo.y;
            });
            if (!mEntries.length) return null;
            let sum = 0;
            mEntries.forEach((e) => {
              const v = parseFloat(e[field]);
              if (!isNaN(v)) sum += v;
            });
            return sum;
          };
          const va = getVal(a),
            vb = getVal(b);
          if (va === null && vb === null) return 0;
          if (va === null) return 1;
          if (vb === null) return -1;
          return (va - vb) * R.monthSortDir;
        });
      }
    }

    const bodyRows = groupList
      .map((g, idx) => {
        const fixedCells = `<td class="rpt-td-sno">${idx + 1}</td><td class="rpt-td-code"><span class="code-pill">${esc(g.code)}</span></td><td class="rpt-td">${esc(g.userId)}</td><td class="rpt-td">${esc(g.software)}</td><td class="rpt-td rpt-td-name">${esc(g.name)}</td><td class="rpt-td">${esc(g.group)}</td><td class="rpt-td rpt-group-end">${esc(g.branchName)}</td>`;

        // Get resp2 entries for this group
        const grpResp2 = resp2ByGroup[g.group] || [];

        const monthCells = months
          .map((mo, mi) => {
            const mEntries = g.entries.filter((e) => {
              const d = parseDT(e.timestamp) || parseDT(e.date);
              if (!d) return false;
              const dt = new Date(d);
              return dt.getMonth() === mo.m && dt.getFullYear() === mo.y;
            });
            // Group Margin from Responses 2 for this group in this month
            const grpMEntries = grpResp2.filter((e) => {
              const d = parseDT(e.timestamp) || parseDT(e.date);
              if (!d) return false;
              const dt = new Date(d);
              return dt.getMonth() === mo.m && dt.getFullYear() === mo.y;
            });
            const borderCls = mi > 0 ? ' rpt-month-border' : '';

            // Group Margin cell: show date - margin pairs
            let grpMHtml = '';
            if (grpMEntries.length) {
              grpMHtml = grpMEntries
                .map((e) => {
                  const d = e.date || '';
                  const m = e.margin || '';
                  return esc(d) + ' - ' + esc(String(m));
                })
                .join('<br>');
            }

            if (!mEntries.length && !grpMEntries.length)
              return `<td class="rpt-td rpt-td-empty${borderCls}"></td><td class="rpt-td rpt-td-empty"></td><td class="rpt-td rpt-td-empty"></td><td class="rpt-td rpt-td-empty"></td>`;
            const dateCol = mEntries.map((e) => esc(e.date || '')).join('<br>');
            const rmsCol = mEntries.map((e) => esc(String(e.marginRMS || ''))).join('<br>');
            const allocCol = mEntries.map((e) => esc(String(e.marginAllocated || ''))).join('<br>');
            return `<td class="rpt-td rpt-td-data${borderCls}">${dateCol}</td><td class="rpt-td rpt-td-num">${rmsCol}</td><td class="rpt-td rpt-td-num">${allocCol}</td><td class="rpt-td rpt-td-data">${grpMHtml}</td>`;
          })
          .join('');

        return `<tr>${fixedCells}${monthCells}</tr>`;
      })
      .join('');

    const monthOpts = MONTH_FULL.map(
      (m, i) => `<option value="${i}" ${i === R.month ? 'selected' : ''}>${m}</option>`
    ).join('');
    const curYear = new Date().getFullYear();
    const yearOpts = [];
    for (let y = curYear - 2; y <= curYear + 2; y++)
      yearOpts.push(`<option value="${y}" ${y === R.year ? 'selected' : ''}>${y}</option>`);

    return `
    <div class="rpt-toolbar">
      <span class="seg-badge ${seg}">${segLabel}</span>
      <div class="rpt-month-selector">
        <label>Month:</label>
        <select data-action="rpt-month">${monthOpts}</select>
        <select data-action="rpt-year">${yearOpts.join('')}</select>
      </div>
      <div class="rpt-toggle-btns">
        <button class="${R.filter === 'all' ? 'active' : ''}" data-action="rpt-filter" data-val="all">All</button>
        <button class="${R.filter === 'change' ? 'active' : ''}" data-action="rpt-filter" data-val="change">Change</button>
        <button class="${R.filter === 'nochange' ? 'active' : ''}" data-action="rpt-filter" data-val="nochange">No Change</button>
      </div>
      <div class="rpt-count">${groupList.length} entries</div>
    </div>
    <div class="rpt-table-wrap">
      <div class="rpt-scroll">
        <table class="rpt-table">
          <thead><tr>${fixedHdr}${monthHdrRow1}</tr><tr>${monthHdrRow2}</tr></thead>
          <tbody>${bodyRows || `<tr><td colspan="${7 + numMonths * 4}" class="rpt-empty">No data found for this selection.</td></tr>`}</tbody>
        </table>
      </div>
    </div>`;
  }
</script>
