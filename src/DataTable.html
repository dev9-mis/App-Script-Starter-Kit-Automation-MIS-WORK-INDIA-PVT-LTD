<script>
  /* ============================= DATA TABLES ============================= */
  const RESP1_COLS = [
    { key: 'timestamp', label: 'Timestamp', width: 170 },
    { key: 'date', label: 'Date', width: 115 },
    { key: 'code', label: 'Code', pill: true, width: 110 },
    { key: 'userId', label: 'User ID', width: 110 },
    { key: 'software', label: 'Software', width: 100 },
    { key: 'name', label: 'Name', width: 300 },
    { key: 'group', label: 'Group Name', width: 150 },
    { key: 'marginRMS', label: 'Margin as per RMS', width: 150 },
    { key: 'marginAllocated', label: 'Margin Allocated on ID', width: 170 },
    { key: 'loginName', label: 'Login Name', width: 140 },
  ];
  const RESP2_COLS = [
    { key: 'timestamp', label: 'Timestamp', width: 170 },
    { key: 'date', label: 'Date', width: 115 },
    { key: 'group', label: 'Group Name', width: 220 },
    { key: 'margin', label: 'Group Margin', width: 150 },
    { key: 'loginName', label: 'Login Name', width: 140 },
  ];
  const MASTER_COLS = [
    { key: 'code', label: 'Code', pill: true, width: 120 },
    { key: 'userId', label: 'User ID', width: 130 },
    { key: 'software', label: 'Software', width: 110 },
    { key: 'name', label: 'Name', width: 340 },
    { key: 'group', label: 'Group Name', width: 180 },
    { key: 'branchName', label: 'Branch Name', width: 130 },
    { key: 'timestamp', label: 'Timestamp', width: 170 },
    { key: 'loginId', label: 'Login ID', width: 120 },
  ];
  const TABLE_DEFS = {
    resp1Equity: { cols: RESP1_COLS, data: () => S.respEquity },
    resp1Commodity: { cols: RESP1_COLS, data: () => S.respCommodity },
    resp2Equity: { cols: RESP2_COLS, data: () => S.resp2Equity },
    resp2Commodity: { cols: RESP2_COLS, data: () => S.resp2Commodity },
    masterEquity: { cols: MASTER_COLS, data: () => S.masterEquity },
    masterCommodity: { cols: MASTER_COLS, data: () => S.masterCommodity },
    // Column-driven projects (e.g. IT Details) don't know their fields ahead
    // of time — cols can be a function resolved from the loaded data's headers.
    itDetails: {
      // Show columns A … "BSE COMMODITY 12 DIGIT FO" (the last real field) —
      // trailing bookkeeping columns (login id, etc.) are hidden.
      cols: () => {
        const headers = S.itDetails.headers || [];
        const norm = (s) => String(s).replace(/\s+/g, ' ').trim().toUpperCase().replace(/&/g, '');
        const lastKeys = ['BSE COMMODITY 12 DIGIT FO', 'BSE COMMODITY 12 DIGIT F&O'].map(norm);
        let end = headers.length;
        for (let i = 0; i < headers.length; i++) {
          if (lastKeys.includes(norm(headers[i]))) {
            end = i + 1;
            break;
          }
        }
        const cols = headers
          .slice(0, end)
          // Synthetic spacer headers (blank_1, blank_2 … given to blank sheet
          // columns to keep indexes aligned) aren't real fields — don't show them.
          .filter((h) => !/^blank_\d+$/i.test(h))
          .map((h) => ({ key: h, label: h, width: 150 }));
        // One extra computed column: Surrender Status = YES (AZ says yes) else "-".
        const surrStH = resolveItHeader(['SURRENDER STATUS']);
        cols.push({
          key: '__surrender',
          label: 'Surrender Status',
          width: 130,
          compute: (r) => (String(r[surrStH] || '').trim().toUpperCase() === 'YES' ? 'YES' : '-'),
        });
        return cols;
      },
      // Skip incomplete sheet rows — only ones with both a Unique No. and a
      // User ID actually represent a saved record.
      data: () => {
        const uniqueH = itUniqueNoHeader(),
          userIdH = resolveItHeader(['USER ID']);
        return (S.itDetails.rows || []).filter(
          (r) => String(r[uniqueH] || '').trim() && String(r[userIdH] || '').trim()
        );
      },
    },
  };

  function renderDataTable(tableKey, extraButtonsHtml) {
    const def = TABLE_DEFS[tableKey];
    const cols = typeof def.cols === 'function' ? def.cols() : def.cols;
    const st = S.dt[tableKey];
    let rows = def.data().slice();
    Object.entries(st.filters).forEach(([k, v]) => {
      if (!v) return;
      rows = rows.filter((r) =>
        String(r[k] ?? '')
          .toLowerCase()
          .includes(v.toLowerCase())
      );
    });
    Object.entries(st.dateFilters || {}).forEach(([k, df]) => {
      if (!df) return;
      const from = df.from ? parseDT(df.from) : null;
      const to = df.to ? parseDT(df.to + (df.to.length <= 10 ? ' 23:59:59' : '')) : null;
      if (!from && !to) return;
      rows = rows.filter((r) => {
        const d = parseDT(r[k]);
        if (d === null) return false;
        if (from && d < from) return false;
        if (to && d > to) return false;
        return true;
      });
    });
    // Table-level status filter (IT Details): active / cancel / surrender.
    if (tableKey === 'itDetails' && st.statusFilter) {
      const statusH = resolveItHeader(['STATUS']),
        surrStH = resolveItHeader(['SURRENDER STATUS']);
      rows = rows.filter((r) => {
        const s = String(r[statusH] || '').trim().toUpperCase();
        if (st.statusFilter === 'active') return s === 'ACTIVE';
        if (st.statusFilter === 'cancel') return s === 'CANCEL';
        if (st.statusFilter === 'surrender')
          return s === 'CANCEL' && String(r[surrStH] || '').trim().toUpperCase() === 'YES';
        return true;
      });
    }
    // Global search over all columns (chainable with everything above).
    if (st.globalSearch) {
      const q = String(st.globalSearch).toLowerCase();
      rows = rows.filter((r) =>
        cols.some((c) => {
          const val = c.compute ? c.compute(r) : r[c.key];
          return String(val == null ? '' : val).toLowerCase().includes(q);
        })
      );
    }
    if (st.sort) {
      const isDateCol = st.sort === 'timestamp' || st.sort === 'date';
      rows.sort((a, b) => {
        let x = a[st.sort],
          y = b[st.sort];
        if (isDateCol) {
          const dx = parseDT(x),
            dy = parseDT(y);
          const ex = dx === null,
            ey = dy === null;
          if (ex && ey) return 0;
          if (ex) return 1;
          if (ey) return -1;
          return (dx - dy) * st.dir;
        }
        const nx = parseFloat(x),
          ny = parseFloat(y);
        if (
          !isNaN(nx) &&
          !isNaN(ny) &&
          String(nx) === String(x).trim() &&
          String(ny) === String(y).trim()
        ) {
          x = nx;
          y = ny;
        }
        if (x < y) return -1 * st.dir;
        if (x > y) return 1 * st.dir;
        return 0;
      });
    }
    const total = rows.length;
    const ps = st.pageSize;
    const tp = Math.max(1, Math.ceil(total / ps));
    if (st.page > tp) st.page = tp;
    if (st.page < 1) st.page = 1;
    const si = (st.page - 1) * ps;
    const pageRows = rows.slice(si, si + ps);
    const visCols = cols.filter((c) => !st.hidden.has(c.key));
    const snoTh = `<th style="width:60px;min-width:60px;max-width:60px;"><div class="th-inner"><div class="th-row"><span class="th-label" style="cursor:default;">S.No</span></div></div></th>`;
    const hdr =
      snoTh +
      visCols
        .map((c) => {
          const w = st.widths[c.key] || c.width || 150;
          const si2 = st.sort === c.key ? (st.dir === 1 ? '▲' : '▼') : '';
          const fo = st.filterOpen === c.key;
          const isDate = isDateColumn(c.key);
          let filterHtml = '';
          if (fo) {
            if (isDate) {
              const df = st.dateFilters[c.key] || { from: '', to: '' };
              const dispVal =
                df.from || df.to
                  ? (df.from ? fmtDR(new Date(df.from + 'T00:00:00')) : '…') +
                    ' – ' +
                    (df.to ? fmtDR(new Date(df.to + 'T00:00:00')) : '…')
                  : '';
              filterHtml = `<div class="th-filter th-date-filter"><input type="text" readonly data-action="open-daterange" data-table="${tableKey}" data-col="${c.key}" value="${esc(dispVal)}" placeholder="Select date range…">${dispVal ? `<span class="dr-clear" data-action="clear-daterange" data-table="${tableKey}" data-col="${c.key}">✕</span>` : ''}</div>`;
            } else {
              filterHtml = `<div class="th-filter"><input type="text" placeholder="Filter…" data-action="filter" data-table="${tableKey}" data-col="${c.key}" value="${esc(st.filters[c.key] || '')}"></div>`;
            }
          }
          return `<th style="width:${w}px;min-width:${w}px;max-width:${w}px;" data-col="${c.key}">
      <div class="th-inner"><div class="th-row">
        <span class="th-label" data-action="sort" data-table="${tableKey}" data-col="${c.key}">${esc(c.label)}</span>
        <span class="sort-ic">${si2}</span>
        <span class="search-ic" data-action="togglesearch" data-table="${tableKey}" data-col="${c.key}">${isDate ? '📅' : '⌕'}</span>
      </div>
      ${filterHtml}
      <div class="resize-handle" data-action="resize" data-table="${tableKey}" data-col="${c.key}"></div>
      </div></th>`;
        })
        .join('');
    const bod = pageRows.length
      ? pageRows
          .map(
            (r, idx) =>
              `<tr><td style="text-align:center;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11.5px;">${si + idx + 1}</td>${visCols
                .map((c) => {
                  const v = c.compute ? c.compute(r) : r[c.key] == null ? '' : r[c.key];
                  return `<td>${c.pill && v ? `<span class="code-pill">${esc(v)}</span>` : esc(v)}</td>`;
                })
                .join('')}</tr>`
          )
          .join('')
      : `<tr><td colspan="${visCols.length + 1}"><div class="empty-state"><div class="big">No matching rows</div>Filters adjust karke dekho, ya abhi koi data nahi hai.</div></td></tr>`;
    const rf = total === 0 ? 0 : si + 1;
    const rt = Math.min(si + ps, total);
    const addPerm =
      tableKey === 'masterEquity'
        ? 'masterEquityAdd'
        : tableKey === 'masterCommodity'
          ? 'masterCommodityAdd'
          : null;
    const canAdd = addPerm && S.user && S.user[addPerm];
    // IT Details gets a status filter + global search. Rendered INSIDE the
    // toolbar so on a wide screen it's one uniform row; on mobile it drops to
    // its own row below the buttons (see .dt-filtergroup in CSS).
    const filterGroup =
      tableKey === 'itDetails'
        ? `<div class="dt-filtergroup">
        <select class="dt-statusfilter" data-action="dt-statusfilter" data-table="${tableKey}">
          <option value="" ${!st.statusFilter ? 'selected' : ''}>All statuses</option>
          <option value="active" ${st.statusFilter === 'active' ? 'selected' : ''}>Active</option>
          <option value="cancel" ${st.statusFilter === 'cancel' ? 'selected' : ''}>Cancel</option>
          <option value="surrender" ${st.statusFilter === 'surrender' ? 'selected' : ''}>Surrender</option>
        </select>
        <div class="dt-globalsearch">
          <span class="dt-gs-ic">⌕</span>
          <input type="text" data-action="dt-globalsearch" data-table="${tableKey}" value="${esc(st.globalSearch || '')}" placeholder="Search any column…">
          ${st.globalSearch ? `<span class="dt-gs-clear" data-action="dt-globalclear" data-table="${tableKey}">✕</span>` : ''}
        </div>
      </div>`
        : '';
    return `
    <div class="dt-toolbar">
      <div class="count">${total} of ${def.data().length} rows</div>
      <button class="btn btn-ghost" data-action="syncnow" style="padding:7px 14px;">${S.syncing ? '⟳ Refreshing…' : '⟳ Refresh'}</button>
      ${canAdd ? `<button class="btn btn-gold" data-action="open-master-add" data-seg="${tableKey === 'masterCommodity' ? 'commodity' : 'equity'}" style="padding:7px 14px;">+ Add</button>` : ''}
      ${extraButtonsHtml || ''}
      ${filterGroup}
      <div class="dt-colmenu-wrap">
        <button class="btn btn-ghost" data-action="togglecolmenu" data-table="${tableKey}" style="padding:7px 14px;">Columns ▾</button>
        ${S.colMenuOpen === tableKey ? `<div class="dt-colmenu"><div class="h">Show / hide columns</div>${cols.map((c) => `<label><input type="checkbox" data-action="togglecol" data-table="${tableKey}" data-col="${c.key}" ${st.hidden.has(c.key) ? '' : 'checked'}> ${esc(c.label)}</label>`).join('')}</div>` : ''}
      </div>
    </div>
    <div class="dt-table-wrap">
      <div class="dt-scroll"><table class="dt"><thead><tr>${hdr}</tr></thead><tbody>${bod}</tbody></table></div>
      <div class="dt-pagination">
        <div class="pp">Rows per page: <select data-action="pagesize" data-table="${tableKey}">${PAGE_SIZE_OPTIONS.map((n) => `<option value="${n}" ${st.pageSize === n ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
        <div>${total === 0 ? '0' : `${rf}–${rt}`} of ${total}</div>
        <div class="nav">
          <button data-action="pagefirst" data-table="${tableKey}" ${st.page <= 1 ? 'disabled' : ''}>«</button>
          <button data-action="pageprev" data-table="${tableKey}" ${st.page <= 1 ? 'disabled' : ''}>‹</button>
          <span class="pageinfo">${st.page} / ${tp}</span>
          <button data-action="pagenext" data-table="${tableKey}" ${st.page >= tp ? 'disabled' : ''}>›</button>
          <button data-action="pagelast" data-table="${tableKey}" ${st.page >= tp ? 'disabled' : ''}>»</button>
        </div>
      </div>
    </div>`;
  }
</script>
