<script>
  /* ============================= CONFIG ============================= */
  const MIN_ROWS = 20;
  const PAGE_SIZE_OPTIONS = [50, 100, 500, 1000];
  const AUTO_LOGOUT_TIME = '23:59';

  /* ============================= STATE ============================= */
  function dtState() {
    return {
      sort: null,
      dir: 1,
      hidden: new Set(),
      filters: {},
      filterOpen: null,
      widths: {},
      page: 1,
      pageSize: 50,
      dateFilters: {},
    };
  }
  function blankRowA() {
    return {
      code: '',
      userId: '',
      software: '',
      name: '',
      group: '',
      branchName: '',
      marginRMS: '',
      marginAllocated: '',
    };
  }
  function blankRowB() {
    return { group: '', margin: '' };
  }
  function freshSeg() {
    return {
      date: '',
      rowsA: Array.from({ length: MIN_ROWS }, blankRowA),
      rowsB: Array.from({ length: 10 }, blankRowB),
      showErrors: false,
    };
  }

  let S = {
    ready: false,
    loadError: '',
    user: null,
    page: null,
    syncing: false,
    dataReady: false, // true once the one post-login batch (getBootstrapData) has arrived
    profileMenuOpen: false,
    showLogoutConfirm: false,
    sidebarOpenSections: new Set(),
    itDetails: { headers: [], rows: [], dbOptions: {}, loaded: false, loading: false, error: '' },
    itForm: null,
    boForm: null,
    masterEquity: [],
    masterCommodity: [],
    respEquity: [],
    respCommodity: [],
    resp2Equity: [],
    resp2Commodity: [],
    users: [],
    missingSheets: [],
    entry: { equity: freshSeg(), commodity: freshSeg() },
    toast: null,
    loginError: '',
    loginView: 'login', // 'login' | 'forgot'
    loggingIn: false,
    loginId: '', // bound to the login fields so a re-render (Signing in… / error)
    loginPw: '', // never wipes what the user typed
    loginInvalid: false, // highlight the fields after a failed attempt
    forgotError: '',
    forgotOk: '',
    forgotBusy: false,
    pwForm: { current: '', next: '', confirm: '', busy: false, error: '', ok: '' },
    dt: {
      resp1Equity: dtState(),
      resp1Commodity: dtState(),
      resp2Equity: dtState(),
      resp2Commodity: dtState(),
      masterEquity: dtState(),
      masterCommodity: dtState(),
      itDetails: dtState(),
    },
    tablePrefs: {}, // per-user saved column widths + hidden columns (by tableKey)
    colMenuOpen: null,
    entryWidths: {},
    logoutAt: 0,
    saving: false,
    masterAdd: null,
    report: {
      month: new Date().getMonth(),
      year: new Date().getFullYear(),
      search: '',
      sort: null,
      sortDir: 1,
      filter: 'all',
      widths: {},
      monthSort: null,
      monthSortDir: 1,
    },
    darkMode: false,
    // Appearance: { mode:'dark'|'light'|'system', accent:'<scheme>'|'random' }.
    // Seeded from the server-injected pref that Theme.html already applied.
    // App settings, seeded from the server-injected blob (theme + layout).
    appearance:
      window.__APPEARANCE__ && typeof window.__APPEARANCE__ === 'object'
        ? {
            mode: window.__APPEARANCE__.mode || 'light',
            accent: window.__APPEARANCE__.accent || 'orange',
            fontSize: window.__APPEARANCE__.fontSize || 100,
          }
        : { mode: 'light', accent: 'orange', fontSize: 100 },
    appearanceSaving: false,
    fontSize:
      (window.__APPEARANCE__ && parseInt(window.__APPEARANCE__.fontSize, 10)) || 100,
    sidebarCollapsed: false,
    sidebarDrawerOpen: false, // mobile off-canvas drawer
    bgSyncing: false, // background 5-min sync in progress (spins the refresh icon)
  };

  try {
    const ew = localStorage.getItem('margin_entry_widths');
    if (ew) S.entryWidths = JSON.parse(ew);
  } catch (e) {}
  try {
    const rw = localStorage.getItem('margin_rpt_widths');
    if (rw) S.report.widths = JSON.parse(rw);
  } catch (e) {}
  // Theme.html already applied the appearance before paint; mirror the resolved
  // dark state so the quick toggle icon is correct.
  S.darkMode = !!(window.__APPEARANCE_APPLIED__ && window.__APPEARANCE_APPLIED__.resolvedDark);
  // Browser-zoom-style text scaling. `zoom` on <body> shrinks/grows the WHOLE
  // app uniformly (font + spacing + controls + overlays). Width auto-fills under
  // zoom, but a definite height (100%) would render short and leave an empty
  // strip — so we counter the body height by 1/zoom, making it fill the viewport
  // exactly at any size (no gap when shrinking, no clipping when enlarging).
  // Every full-height element uses height:100% so it chains down and fills.
  function applyFontZoom(fs) {
    const b = document.body;
    if (!b) return;
    const z = (fs || 100) / 100;
    if (z === 1) {
      b.style.zoom = '';
      b.style.height = '';
    } else {
      b.style.zoom = z;
      b.style.height = 100 / z + 'vh';
    }
  }
  // Apply the layout font size that came from Script Properties (no localStorage;
  // the setting lives server-side so it follows the app everywhere).
  if (S.fontSize >= 70 && S.fontSize <= 130 && S.fontSize !== 100) applyFontZoom(S.fontSize);

  // Persist a font-size change to Script Properties (debounced so rapid A-/A+
  // clicks make one write). It's stored in the same settings blob as the theme.
  let fontSaveTimer = null;
  function saveFontSizePref() {
    S.appearance = Object.assign({}, S.appearance, { fontSize: S.fontSize });
    window.__APPEARANCE__ = S.appearance;
    clearTimeout(fontSaveTimer);
    fontSaveTimer = setTimeout(() => {
      google.script.run
        .withSuccessHandler(() => {})
        .withFailureHandler(() => {})
        .saveAppearance(S.appearance);
    }, 700);
  }
  try {
    S.sidebarCollapsed = localStorage.getItem('margin_sidebar_collapsed') === 'true';
  } catch (e) {}
  function saveEntryWidths() {
    try {
      localStorage.setItem('margin_entry_widths', JSON.stringify(S.entryWidths));
    } catch (e) {}
  }

  /* ---------------- Appearance (theme) ---------------- */
  // Merge a change, apply it live, mirror dark state, and persist to the server
  // (Script Properties) so it reflects on the next load for everyone.
  function setAppearance(patch) {
    S.appearance = Object.assign({}, S.appearance, patch || {});
    window.__APPEARANCE__ = S.appearance; // keep the OS-change listener in sync
    // Picking "Surprise me" rolls a fresh random colour immediately.
    const applied =
      patch && patch.accent === 'random'
        ? window.reshuffleAppearance()
        : window.applyAppearance(S.appearance);
    S.darkMode = applied.resolvedDark;
    S.appearanceSaving = true;
    google.script.run
      .withSuccessHandler(() => {
        S.appearanceSaving = false;
      })
      .withFailureHandler(() => {
        S.appearanceSaving = false;
      })
      .saveAppearance(S.appearance);
    render();
  }
  function accentSwatch(hex, hex2) {
    return 'linear-gradient(135deg,' + hex + ' 0%,' + (hex2 || hex) + ' 100%)';
  }
  function freshRows() {
    S.entry = { equity: freshSeg(), commodity: freshSeg() };
  }

  /* ============================= APPS SCRIPT BRIDGE ============================= */
  function runServer(fnName, ...args) {
    return new Promise((resolve, reject) => {
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        reject(
          new Error(
            'google.script.run not available — open this page via the Apps Script /exec URL.'
          )
        );
        return;
      }
      let call = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler((err) => reject(new Error(err.message || String(err))));
      call[fnName](...args);
    });
  }

  function applyBootstrap(data) {
    // google.script.run resolves to null if the server payload failed to
    // serialize — guard so it's a clear message, not "reading 'masterEquity'".
    if (!data) throw new Error('Server returned no data (payload could not be loaded). Try Refresh.');
    S.masterEquity = data.masterEquity || [];
    S.masterCommodity = data.masterCommodity || [];
    S.respEquity = data.respEquity || [];
    S.respCommodity = data.respCommodity || [];
    S.resp2Equity = data.resp2Equity || [];
    S.resp2Commodity = data.resp2Commodity || [];
    // Perms only — passwords never reach the browser (authenticate() checks
    // them server-side), so a plain replace is correct here.
    S.users = data.users || [];
    S.missingSheets = data.missingSheets || [];
    // IT Details is preloaded in the same batch (when the user has the perm),
    // so its page renders instantly with no extra round-trip. If the project
    // Sheet URL was bad, mark the error so the page shows a Retry instead.
    if (data.itDetails) {
      if (data.itDetails.success) {
        S.itDetails.headers = data.itDetails.headers || [];
        S.itDetails.rows = data.itDetails.data || [];
        S.itDetails.dbOptions = data.itDetails.dbOptions || {};
        S.itDetails.loaded = true;
        S.itDetails.error = '';
      } else {
        S.itDetails.error = data.itDetails.message || 'Failed to load IT Details.';
      }
      S.itDetails.loading = false;
    }
  }

  /* ---- Per-user DataTable preferences (column widths + hidden columns) ----
     Loaded once after login and re-applied so a user's layout follows them
     across sessions/devices; saved (debounced) whenever they resize a column
     or toggle one on/off. Stored server-side in Script Properties by user id. */
  function applyTablePrefs(prefs) {
    S.tablePrefs = prefs && typeof prefs === 'object' ? prefs : {};
    Object.keys(S.tablePrefs).forEach((tk) => {
      if (!S.dt[tk]) return;
      const p = S.tablePrefs[tk] || {};
      if (p.widths && typeof p.widths === 'object') S.dt[tk].widths = Object.assign({}, p.widths);
      if (Array.isArray(p.hidden)) S.dt[tk].hidden = new Set(p.hidden);
    });
  }
  let tablePrefTimer = null;
  function persistTablePref(tableKey) {
    if (!S.user || !S.dt[tableKey]) return;
    if (!S.tablePrefs) S.tablePrefs = {};
    const st = S.dt[tableKey];
    S.tablePrefs[tableKey] = {
      widths: Object.assign({}, st.widths),
      hidden: Array.from(st.hidden),
    };
    clearTimeout(tablePrefTimer);
    tablePrefTimer = setTimeout(() => {
      google.script.run
        .withSuccessHandler(function () {})
        .withFailureHandler(function () {})
        .saveUserTablePrefs(S.user.id, S.tablePrefs);
    }, 600);
  }

  async function loadAll() {
    // Login is verified server-side (authenticate), so we no longer need to
    // pre-fetch the user list — show the login screen INSTANTLY with no
    // round-trip. All data loads in one batch right after a successful login.
    S.ready = true;
    render();
    startClock();
  }

  async function loadHeavyData() {
    S.syncing = true;
    render();
    try {
      const perms = S.user
        ? {
            equityEntry: S.user.equityEntry,
            commodityEntry: S.user.commodityEntry,
            masterEquity: S.user.masterEquity,
            masterCommodity: S.user.masterCommodity,
            masterEquityAdd: S.user.masterEquityAdd,
            masterCommodityAdd: S.user.masterCommodityAdd,
            resp1Equity: S.user.resp1Equity,
            resp1Commodity: S.user.resp1Commodity,
            resp2Equity: S.user.resp2Equity,
            resp2Commodity: S.user.resp2Commodity,
            report: S.user.report,
            itDetails: S.user.itDetails,
          }
        : null;
      applyBootstrap(await runServer('getBootstrapData', perms));
      if (S.user) {
        // getBootstrapData already returns fresh users (read from LOGIN PAGE in
        // the same call), so merge the latest perms from there — no extra
        // getUserPermissions round-trip needed.
        const f = S.users.find((u) => u.id.toLowerCase() === S.user.id.toLowerCase());
        if (f) S.user = Object.assign({}, S.user, f);
        // Restore this user's saved table layout (column widths + hidden cols).
        try {
          applyTablePrefs(await runServer('getUserTablePrefs', S.user.id));
        } catch (e) {}
      }
      S.loadError = '';
      S.dataReady = true;
    } catch (err) {
      // Surface a retryable error screen instead of an endless "Loading data…".
      S.loadError = 'Data load failed: ' + err.message;
      showToast('Data load error: ' + err.message, true);
    }
    S.syncing = false;
    freshRows();
    render();
    // Kick off the background 5-min auto-sync once the first load succeeded.
    if (S.user && S.dataReady) startAutoSync();
  }

  async function refreshData() {
    S.syncing = true;
    render();
    try {
      const perms = S.user
        ? {
            equityEntry: S.user.equityEntry,
            commodityEntry: S.user.commodityEntry,
            masterEquity: S.user.masterEquity,
            masterCommodity: S.user.masterCommodity,
            masterEquityAdd: S.user.masterEquityAdd,
            masterCommodityAdd: S.user.masterCommodityAdd,
            resp1Equity: S.user.resp1Equity,
            resp1Commodity: S.user.resp1Commodity,
            resp2Equity: S.user.resp2Equity,
            resp2Commodity: S.user.resp2Commodity,
            report: S.user.report,
            itDetails: S.user.itDetails,
          }
        : null;
      applyBootstrap(await runServer('getBootstrapData', perms));
      if (S.user) {
        const fresh = await runServer('getUserPermissions', S.user.id);
        if (fresh) S.user = Object.assign({}, S.user, fresh);
        const pk = allNavItems().find((n) => n.key === S.page)?.perm;
        if (pk && !S.user[pk]) S.page = firstAllowedPage();
      }
      S.loadError = '';
      S.dataReady = true;
      S.syncing = false;
      Object.keys(S.dt).forEach((k) => {
        S.dt[k].filters = {};
        S.dt[k].dateFilters = {};
        S.dt[k].filterOpen = null;
        S.dt[k].page = 1;
      });
      showToast('Sheet se latest data mil gaya.', false);
      render();
    } catch (err) {
      S.syncing = false;
      showToast('Refresh nahi ho paya: ' + err.message, true);
      render();
    }
  }

  /* ===================== BACKGROUND AUTO-SYNC (every 5 min) =====================
     After login, silently pulls fresh sheet data into the global store every 5
     minutes. It never disturbs an in-progress save or active typing — it defers
     that cycle — and it doesn't reset filters/paging or show a toast/spinner.
     The store is updated in the background so any table/form opened afterwards
     shows the latest data; the visible page repaints only when it's safe. */
  const AUTO_SYNC_MS = 5 * 60 * 1000;
  let autoSyncTimer = null;
  let autoSyncInFlight = false;

  // True when we must NOT touch the UI/data: a save/server op is running, or the
  // user is mid-interaction (typing, a dropdown/menu open).
  function appIsBusy() {
    if (document.getElementById('savingOverlay')) return true;
    if (S.syncing || S.loggingIn || S.forgotBusy) return true;
    if (S.boForm && S.boForm.saving) return true;
    if (S.mgForm && S.mgForm.saving) return true;
    if (S.itForm && S.itForm.saving) return true;
    if (S.pwForm && S.pwForm.busy) return true;
    if (S.profileMenuOpen || S.colMenuOpen || S.showLogoutConfirm) return true;
    const ae = document.activeElement;
    if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT')) {
      return true;
    }
    return false;
  }

  function bootstrapPerms() {
    return S.user
      ? {
          equityEntry: S.user.equityEntry,
          commodityEntry: S.user.commodityEntry,
          masterEquity: S.user.masterEquity,
          masterCommodity: S.user.masterCommodity,
          masterEquityAdd: S.user.masterEquityAdd,
          masterCommodityAdd: S.user.masterCommodityAdd,
          resp1Equity: S.user.resp1Equity,
          resp1Commodity: S.user.resp1Commodity,
          resp2Equity: S.user.resp2Equity,
          resp2Commodity: S.user.resp2Commodity,
          report: S.user.report,
          itDetails: S.user.itDetails,
        }
      : null;
  }

  // Spin the "Refresh from Sheet" icon(s) + swap the label — done via direct DOM
  // so the ongoing work/page is never re-rendered or disturbed.
  function setSyncIndicator(on) {
    document.querySelectorAll('.sync-ic').forEach((el) => el.classList.toggle('sync-spin', on));
    document.querySelectorAll('.sync-label').forEach((el) => {
      el.textContent = on ? 'Syncing data…' : 'Refresh from Sheet';
    });
  }

  async function backgroundRefresh() {
    if (!S.user || !S.dataReady) return; // only when logged in and initial load done
    if (autoSyncInFlight || appIsBusy()) return; // defer — a save/typing is happening
    autoSyncInFlight = true;
    S.bgSyncing = true;
    setSyncIndicator(true);
    try {
      const data = await runServer('getBootstrapData', bootstrapPerms());
      if (!data) return;
      // A save may have STARTED while we were fetching — don't overwrite the
      // store from under it; just skip this cycle and catch it on the next tick.
      if (
        document.getElementById('savingOverlay') ||
        (S.boForm && S.boForm.saving) ||
        (S.mgForm && S.mgForm.saving) ||
        (S.itForm && S.itForm.saving)
      ) {
        return;
      }
      // Update the global store WITHOUT resetting filters/paging or the form.
      applyBootstrap(data);
      if (S.user) {
        const f = S.users.find((u) => u.id.toLowerCase() === S.user.id.toLowerCase());
        if (f) S.user = Object.assign({}, S.user, f);
      }
      S.lastAutoSync = Date.now();
      // Repaint the visible page ONLY if the user isn't interacting right now, so
      // an open table shows the fresh rows without interrupting anything.
      if (!appIsBusy()) render();
    } catch (e) {
      // Silent: background sync, will retry on the next tick.
    } finally {
      autoSyncInFlight = false;
      S.bgSyncing = false;
      setSyncIndicator(false);
    }
  }

  function startAutoSync() {
    stopAutoSync();
    autoSyncTimer = setInterval(backgroundRefresh, AUTO_SYNC_MS);
  }
  function stopAutoSync() {
    if (autoSyncTimer) {
      clearInterval(autoSyncTimer);
      autoSyncTimer = null;
    }
  }

  /* ============================= SEGMENT HELPERS ============================= */
  function currentSegment() {
    return S.page === 'entryCommodity' ? 'commodity' : S.page === 'entryEquity' ? 'equity' : null;
  }
  function masterFor(seg) {
    return seg === 'commodity' ? S.masterCommodity : S.masterEquity;
  }
  function uniqueCodes(seg) {
    return Array.from(
      new Set(
        masterFor(seg)
          .map((m) => m.code)
          .filter(Boolean)
      )
    ).sort();
  }
  function matchesForCode(seg, code) {
    return masterFor(seg).filter((m) => m.code === code);
  }
  function groupNamesList(seg) {
    return Array.from(
      new Set(
        masterFor(seg)
          .map((m) => m.group)
          .filter(Boolean)
      )
    ).sort();
  }

  const CASCADE_FIELDS = ['userId', 'software', 'name', 'group', 'branchName'];

  function resolveCascade(seg, r) {
    const info = {};
    let matches = r.code ? matchesForCode(seg, r.code) : [];
    let blocked = !r.code;
    CASCADE_FIELDS.forEach((f) => {
      if (blocked) {
        r[f] = '';
        info[f] = { options: [], dropdown: false };
        return;
      }
      const distinct = Array.from(new Set(matches.map((m) => m[f]).filter(Boolean)));
      if (distinct.length === 0) {
        r[f] = '';
        info[f] = { options: [], dropdown: false };
        blocked = true;
        return;
      }
      if (distinct.length === 1) {
        r[f] = distinct[0];
        info[f] = { options: distinct, dropdown: false };
        matches = matches.filter((m) => m[f] === distinct[0]);
        return;
      }
      info[f] = { options: distinct, dropdown: true };
      if (r[f] && distinct.includes(r[f])) {
        matches = matches.filter((m) => m[f] === r[f]);
      } else {
        r[f] = '';
        blocked = true;
      }
    });
    return info;
  }

  function filterOptionsContains(options, query) {
    if (!query) return options;
    const q = String(query).toLowerCase();
    return options.filter((o) => String(o).toLowerCase().includes(q));
  }

  function buildCascadeCellHtml(f, i, val, opt, isErr) {
    val = val || '';
    if (opt && opt.dropdown) {
      const listId = `cl-${f}-${i}`;
      const filtered = filterOptionsContains(opt.options, val);
      return `<input type="text" class="${isErr ? 'cell-error' : ''}" data-field="${f}" data-a="${f}" data-i="${i}" list="${listId}" value="${esc(val)}" placeholder="Select…" autocomplete="off"><datalist id="${listId}">${filtered.map((o) => `<option value="${esc(o)}">`).join('')}</datalist>`;
    }
    return `<div class="cell-ro${isErr ? ' cell-error' : ''}" data-field="${f}">${esc(val)}</div>`;
  }

  function refreshDatalist(listId, options) {
    const dl = document.getElementById(listId);
    if (!dl) return;
    dl.innerHTML = options.map((o) => `<option value="${esc(o)}">`).join('');
  }

  function liveSyncRow(seg, i, activeField) {
    const E = S.entry[seg];
    const r = E.rowsA[i];
    if (!r) return;
    const info = resolveCascade(seg, r);
    const row = document.querySelector(`tr[data-rowa="${i}"]`);
    if (!row) return;
    const anyA =
      r.code ||
      r.userId !== '' ||
      r.software ||
      r.name ||
      r.group ||
      r.branchName ||
      r.marginRMS !== '' ||
      r.marginAllocated !== '';
    const showE = E.showErrors && anyA;

    if (activeField === 'code') {
      const codeInput = row.querySelector('[data-a="code"]');
      if (codeInput)
        refreshDatalist('codelist', filterOptionsContains(uniqueCodes(seg), codeInput.value));
    }

    CASCADE_FIELDS.forEach((f) => {
      if (f === activeField) {
        if (info[f] && info[f].dropdown) {
          const liveEl = row.querySelector(`[data-field="${f}"]`);
          if (liveEl && liveEl.tagName === 'INPUT')
            refreshDatalist(`cl-${f}-${i}`, filterOptionsContains(info[f].options, liveEl.value));
        }
        return;
      }
      const cell = row.querySelector(`[data-field="${f}"]`);
      if (!cell) return;
      const td = cell.closest('td');
      if (!td) return;
      td.innerHTML = buildCascadeCellHtml(f, i, r[f], info[f], showE && !r[f]);
    });
  }

  /* ============================= HELPERS ============================= */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return '&#' + c.charCodeAt(0) + ';';
    });
  }
  function trashIcon() {
    return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>`;
  }
  function fmtNow() {
    const d = new Date();
    const M = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const p = (n) => String(n).padStart(2, '0');
    return `${p(d.getDate())}-${M[d.getMonth()]}-${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  }
  function fmtDateDisplay(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-');
    const M = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return `${d}-${M[parseInt(m, 10) - 1]}-${y}`;
  }

  function parseDT(v) {
    if (v == null) return null;
    const s = String(v).trim();
    if (!s) return null;
    const M = {
      jan: 0,
      feb: 1,
      mar: 2,
      apr: 3,
      may: 4,
      jun: 5,
      jul: 6,
      aug: 7,
      sep: 8,
      oct: 9,
      nov: 10,
      dec: 11,
    };
    const m = s.match(
      /^(\d{1,2})[-\/\s]([A-Za-z]{3,})[-\/\s](\d{4})(?:[\sT]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/
    );
    if (m) {
      const day = +m[1],
        mon = M[m[2].slice(0, 3).toLowerCase()],
        yr = +m[3];
      if (mon === undefined) return null;
      const hh = +(m[4] || 0),
        mm = +(m[5] || 0),
        ss = +(m[6] || 0);
      return new Date(yr, mon, day, hh, mm, ss).getTime();
    }
    const t = Date.parse(s);
    return isNaN(t) ? null : t;
  }

    const parts = String(AUTO_LOGOUT_TIME).split(':');

      m = parseInt(parts[1], 10) || 0;
    const now = new Date();
    const t = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0, 0);
    if (t.getTime() <= now.getTime()) t.setDate(t.getDate() + 1);
    return t.getTime();

    const d = new Date();

      m = d.getMinutes(),
      s = d.getSeconds();
    const ampm = h >= 12 ? 'PM' : 'AM';
    const h12 = h % 12 || 12;
    const pad = (n) => String(n).padStart(2, '0');
    return `${pad(h12)}:${pad(m)}:${pad(s)} ${ampm}`;
  }

  async function doLogin(id, pw) {
    // Checked on the SERVER against the live sheet — so a password changed
    // elsewhere (e.g. a temp password just emailed) works immediately, and no
    // password is ever held in the browser.
    S.loginError = '';
    S.loginInvalid = false;
    S.loginId = id; // keep what was submitted so the fields don't blank mid-submit
    S.loginPw = pw;
    S.loggingIn = true;
    render();
    let res;
    try {
      res = await runServer('authenticate', id, pw);
    } catch (err) {
      S.loggingIn = false;
      S.loginInvalid = true;
      S.loginError = err.message;
      render();
      return;
    }
    S.loggingIn = false;
    if (!res || !res.success) {
      S.loginInvalid = true; // highlight both fields, keep the entered values
      S.loginError = (res && res.message) || 'Invalid User ID or password. Please check and try again.';
      render();
      return;
    }
    const u = res.user;
    S.user = u;
    // Success — clear the credentials from the form/state.
    S.loginId = '';
    S.loginPw = '';
    S.loginInvalid = false;
    S.loginError = '';
    S.dataReady = false; // reset so a re-login after logout shows loading, not stale data
    S.sidebarOpenSections = new Set();
    S.logoutAt = nextLogoutTs();
    S.page = 'dashboard'; // always land somewhere meaningful, never a random form
    render(); // shows the clean "Loading data…" state (dataReady is false) — no empty flash
    // ONE batch loads every sheet this user has YES for (getBootstrapData is
    // perms-gated) and refreshes perms from the same call. No extra round-trip.
    await loadHeavyData();
    // Signed in with an emailed temporary password -> send them straight to
    // Profile to set a real one.
    if (S.user && S.user.mustChangePassword) {
      S.pwForm = { current: '', next: '', confirm: '', busy: false, error: '', ok: '' };
      S.page = 'profile';
    }
    render();
  }

  async function doForgotPassword(needle) {
    if (S.forgotBusy) return;
    const who = String(needle || '').trim();
    if (!who) {
      S.forgotError = 'Please enter your User ID or email.';
      S.forgotOk = '';
      render();
      return;
    }
    S.forgotBusy = true;
    S.forgotError = '';
    S.forgotOk = '';
    render();
    try {
      const res = await runServer('requestPasswordReset', who);
      if (res && res.success) {
        S.forgotOk = res.message || 'Sent.';
        S.forgotError = '';
      } else {
        S.forgotError = (res && res.message) || 'Could not send the email.';
      }
    } catch (err) {
      S.forgotError = err.message;
    }
    S.forgotBusy = false;
    render();
  }

  async function doChangePassword() {
    const F = S.pwForm;
    if (F.busy) return;
    F.error = '';
    F.ok = '';
    const cur = String(F.current || '').trim();
    const next = String(F.next || '').trim();
    const conf = String(F.confirm || '').trim();
    if (!cur || !next || !conf) {
      F.error = 'Please fill all three fields.';
      render();
      return;
    }
    if (next.length < 3) {
      F.error = 'New password must be at least 3 characters.';
      render();
      return;
    }
    if (next !== conf) {
      F.error = 'New password and confirm password do not match.';
      render();
      return;
    }
    F.busy = true;
    render();
    try {
      const res = await runServer('changePassword', {
        id: S.user.id,
        currentPassword: cur,
        newPassword: next,
      });
      if (res && res.success) {
        F.ok = res.message || 'Password changed.';
        F.current = F.next = F.confirm = '';
        // No longer a temporary password — drop the forced-change banner.
        if (S.user) S.user.mustChangePassword = false;
        showToast('Password changed successfully.', false);
      } else {
        F.error = (res && res.message) || 'Could not change the password.';
      }
    } catch (err) {
      F.error = err.message;
    }
    F.busy = false;
    render();
  }

          <h2>${PAGE_TITLES[S.page] || 'Dashboard'}</h2>${pageSeg ? `<span class="seg-badge ${pageSeg}">${pageSeg}</span>` : ''}
        </div>
        <div class="topbar-right">
          <div class="topbar-controls"><button data-action="font-down" title="Smaller text">A-</button><button data-action="font-reset" title="Reset size">A</button><button data-action="font-up" title="Larger text">A+</button></div>
          <div class="topbar-clock" id="liveClock">${lastClockText || '--:--:--'}</div>
          <div class="profile-wrap">
            <button class="profile-btn ${S.profileMenuOpen ? 'open' : ''}" data-action="toggle-profile">
              <div class="avatar">${initials}</div>
              <div class="profile-meta"><span class="profile-name">${esc(S.user.name)}</span><span class="profile-role">${esc(S.user.id || '')}</span></div>
              <span class="profile-caret">▾</span>
            </button>
            ${
              S.profileMenuOpen
                ? `<div class="profile-menu">
              <div class="profile-menu-head"><div class="avatar lg">${initials}</div><div class="pm-info"><div class="pm-name">${esc(S.user.name)}</div><div class="pm-id">${esc(S.user.id || '')}</div></div></div>
              <div class="profile-menu-item" data-action="open-profile"><span class="pm-ic">👤</span>My Profile</div>

              <div class="profile-menu-item pm-fontrow"><span class="pm-ic">🔤</span>Text size<span class="pm-font-btns"><button data-action="font-down" title="Smaller">A-</button><button data-action="font-reset" title="Reset">A</button><button data-action="font-up" title="Larger">A+</button></span></div>

  ${S.toast ? `<div class="toast ${S.toast.isErr ? 'err' : ''}"><span>${S.toast.isErr ? '⚠' : '✓'}</span>${esc(S.toast.msg)}</div>` : ''}
  ${

  /* ============================= NAV ACTION ============================= */
  async function navigateTo(pageKey) {
    S.colMenuOpen = null;
    S.sidebarDrawerOpen = false; // close the mobile drawer on navigation
    S.page = pageKey;
    render();
    if (pageKey === 'itDetails' || pageKey === 'backoffice' || pageKey === 'marginEntry')
      ensureITDetailsLoaded();
    try {
      const fresh = await runServer('getUserPermissions', S.user.id);
      if (fresh) {
        S.user = Object.assign({}, S.user, fresh);
        const pk = allNavItems().find((n) => n.key === S.page)?.perm;
        if (pk && !S.user[pk]) {
          showToast('Ye page ab aapke liye uplabdh nahi hai.', true);
          S.page = firstAllowedPage();
        }
        render();
      }
    } catch (e) {}
  }

  /* ============================= EVENTS ============================= */
  let resizeCtx = null,
    rowResizeCtx = null,
    eResizeCtx = null,
    filterTimer = null,
    spSearchTimer = null,
    regSearchTimer = null;
  document.addEventListener('submit', (e) => {
    if (e.target && e.target.id === 'loginForm') {
      e.preventDefault();
      doLogin(document.getElementById('loginId').value, document.getElementById('loginPw').value);
      return;
    }
    if (e.target && e.target.id === 'forgotForm') {
      e.preventDefault();
      const el = document.getElementById('forgotId');
      doForgotPassword(el ? el.value : '');
      return;
    }
    if (e.target && e.target.id === 'pwForm') {
      e.preventDefault();
      doChangePassword();
      return;
    }
  });

  document.addEventListener('focusout', (e) => {
    const el = e.target;
    if (el.hasAttribute('data-a')) {
      const f = el.getAttribute('data-a');
      if (f === 'code' || CASCADE_FIELDS.indexOf(f) !== -1) {
        setTimeout(() => render(), 100);
      }
    }
  });

  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.classList.contains('cell-error') && el.value) {
      el.classList.remove('cell-error');
      el.style.borderColor = '';
      el.style.background = '';
    }
    // Login fields: keep typed values in state (so a re-render during "Signing
    // in…" or after an error never wipes them) and clear the invalid highlight.
    if (el.hasAttribute('data-login')) {
      if (el.getAttribute('data-login') === 'id') S.loginId = el.value;
      else S.loginPw = el.value;
      if (S.loginInvalid) {
        S.loginInvalid = false;
        document.querySelectorAll('.login2-form .l2-input.invalid').forEach((n) => n.classList.remove('invalid'));
      }
      return;
    }
    if (el.hasAttribute('data-a') || el.hasAttribute('data-b')) {
      onEntryFieldInput(el);
      return;
    }
    if (el.hasAttribute('data-madd')) {
      onMasterAddInput(el);
      return;
    }
    if (el.hasAttribute('data-pw')) {
      // Change-password fields: keep state in sync WITHOUT re-rendering (a
      // re-render would blow away focus and the typed value).
      S.pwForm[el.getAttribute('data-pw')] = el.value;
      return;
    }
    if (el.hasAttribute('data-itfield')) {
      onItFieldInput(el);
      return;
    }
    if (el.getAttribute('data-action') === 'sp-search') {
      const key = el.getAttribute('data-sp');
      S.itForm.pickerQuery = el.value;
      clearTimeout(spSearchTimer);
      spSearchTimer = setTimeout(() => {
        const pos = el.selectionStart;
        render();
        const ag = document.querySelector(`input[data-action="sp-search"][data-sp="${key}"]`);
        if (ag) {
          ag.focus();
          ag.setSelectionRange(pos, pos);
        }
      }, 200);
      return;
    }
    if (el.getAttribute('data-action') === 'reg-search') {
      S.itForm.regQuery = el.value;
      clearTimeout(regSearchTimer);
      regSearchTimer = setTimeout(() => {
        const pos = el.selectionStart;
        render();
        const ag = document.querySelector('input[data-action="reg-search"]');
        if (ag) {
          ag.focus();
          ag.setSelectionRange(pos, pos);
        }
      }, 200);
      return;
    }
    if (el.hasAttribute('data-bo')) {
      // Backoffice code/remark inputs — update state without a re-render so the
      // typed value and cursor aren't wiped.
      S.boForm[el.getAttribute('data-bo')] = el.value;
      if (el.classList.contains('cell-error') && el.value) el.classList.remove('cell-error');
      return;
    }
    if (
      el.getAttribute('data-action') === 'bo-usearch' ||
      el.getAttribute('data-action') === 'bo-fsearch'
    ) {
      const act = el.getAttribute('data-action');
      S.boForm[act === 'bo-usearch' ? 'uQuery' : 'fQuery'] = el.value;
      clearTimeout(regSearchTimer);
      regSearchTimer = setTimeout(() => {
        const pos = el.selectionStart;
        render();
        const ag = document.querySelector(`input[data-action="${act}"]`);
        if (ag) {
          ag.focus();
          ag.setSelectionRange(pos, pos);
        }
      }, 200);
      return;
    }
    if (el.getAttribute('data-action') === 'bo-colsearch') {
      const col = el.getAttribute('data-bocol');
      S.boForm.search[col] = el.value;
      S.boForm.page = 1;
      clearTimeout(filterTimer);
      filterTimer = setTimeout(() => {
        const pos = el.selectionStart;
        render();
        const ag = document.querySelector(`input[data-action="bo-colsearch"][data-bocol="${col}"]`);
        if (ag) {
          ag.focus();
          ag.setSelectionRange(pos, pos);
        }
      }, 250);
      return;
    }
    if (el.getAttribute('data-action') === 'bo-globalsearch') {
      S.boForm.globalQuery = el.value;
      S.boForm.page = 1;
      clearTimeout(filterTimer);
      filterTimer = setTimeout(() => {
        const pos = el.selectionStart;
        render();
        const ag = document.querySelector('input[data-action="bo-globalsearch"]');
        if (ag) {
          ag.focus();
          ag.setSelectionRange(pos, pos);
        }
      }, 250);
      return;
    }
    /* ---- Margin Entry inputs (mirrors the Backoffice ones) ---- */
    if (el.hasAttribute('data-mg') && el.tagName !== 'SELECT') {
      const mgKey = el.getAttribute('data-mg');
      // Numeric fields: live Indian-format the display, store the raw number.
      if (MG_NUMERIC_KEYS.indexOf(mgKey) > -1) {
        S.mgForm[mgKey] = mgReformatInput(el);
      } else {
        S.mgForm[mgKey] = el.value;
      }
      if (el.classList.contains('cell-error') && el.value) el.classList.remove('cell-error');
      return;
    }
    if (
      el.getAttribute('data-action') === 'mg-usearch' ||
      el.getAttribute('data-action') === 'mg-fsearch'
    ) {
      const act = el.getAttribute('data-action');
      S.mgForm[act === 'mg-usearch' ? 'uQuery' : 'fQuery'] = el.value;
      clearTimeout(regSearchTimer);
      regSearchTimer = setTimeout(() => {
        const pos = el.selectionStart;
        render();
        const ag = document.querySelector(`input[data-action="${act}"]`);
        if (ag) {
          ag.focus();
          ag.setSelectionRange(pos, pos);
        }
      }, 200);

      th.style.width = nw + 'px';
      th.style.minWidth = nw + 'px';
      th.style.maxWidth = nw + 'px';
    }
  });
  document.addEventListener('mouseup', (e) => {
    if (eResizeCtx) {
      const nw = Math.max(30, Math.round(eResizeCtx.startW + (e.clientX - eResizeCtx.startX)));
      if (eResizeCtx.isRpt) {
        S.report.widths[eResizeCtx.col] = nw;
        try {
          localStorage.setItem('margin_rpt_widths', JSON.stringify(S.report.widths));
        } catch (e) {}
      } else {
        S.entryWidths[eResizeCtx.col] = nw;
        saveEntryWidths();
      }
      eResizeCtx = null;
      return;
    }
    if (rowResizeCtx) {
      rowResizeCtx = null;
      return;
    }
    if (!resizeCtx) return;
    S.dt[resizeCtx.t].widths[resizeCtx.c] = Math.max(
      60,
      Math.round(resizeCtx.startW + (e.clientX - resizeCtx.startX))
    );
    persistTablePref(resizeCtx.t);
    resizeCtx.el.classList.remove('active');
    resizeCtx = null;
    render();
  });

  /* ============================= RENDER ============================= */
  function render() {
    const app = document.getElementById('app');
    if (!S.ready) {
      app.innerHTML = `<div class="loading-screen"><div class="spinner"></div><div>Loading margin data…</div></div>`;
      return;
    }
    if (S.loadError) {
      app.innerHTML = `<div class="login-wrap"><div class="login-card"><div class="login-top"><div class="login-eyebrow">Setup</div><h1>Sheet load failed</h1></div><div class="login-body"><div class="login-error">${esc(S.loadError)}</div><div class="login-hint">1) Open via the Apps Script <b>/exec</b> URL. 2) Required tabs: LOGIN PAGE, MASTER EQUITY, MASTER COMODDITY, RESPONSES EQUITY, RESPONSES COMODDITY, RESPONSES 2 EQUITY, RESPONSES 2 COMODDITY. 3) Deploy access = "Anyone".</div><button class="btn btn-gold btn-block" style="margin-top:14px;" data-action="syncnow">Retry</button></div></div></div>`;
      return;
    }
    if (!S.user) {
      app.innerHTML = renderLogin();
      return;
    }
    // Save scroll positions before re-render
    const rptScroll = document.querySelector('.rpt-scroll');
    const dtScroll = document.querySelector('.dt-scroll');
    const itformScroll = document.querySelector('.itform-body');
    const boPage = document.querySelector('.bo-page'); // Backoffice / Margin page (mobile = its own scroller)
    const boWrap = document.querySelector('.bo-tablewrap'); // its table's internal scroll
    const savedRptScrollLeft = rptScroll ? rptScroll.scrollLeft : 0;
    const savedRptScrollTop = rptScroll ? rptScroll.scrollTop : 0;
    const savedDtScrollLeft = dtScroll ? dtScroll.scrollLeft : 0;
    const savedDtScrollTop = dtScroll ? dtScroll.scrollTop : 0;
    const savedItformScrollTop = itformScroll ? itformScroll.scrollTop : 0;
    const savedBoPageTop = boPage ? boPage.scrollTop : 0;
    const savedBoWrapLeft = boWrap ? boWrap.scrollLeft : 0;
    const savedBoWrapTop = boWrap ? boWrap.scrollTop : 0;
    let inner = '';
    // Show one clean loading state from login until the batch arrives — no
    // empty-page flash, and it's correct for every user (incl. IT-Details-only
    // users who never load equity/response data).
    if (!S.dataReady) {
      inner = `<div class="empty-state" style="padding-top:80px;"><div class="spinner" style="margin:0 auto 16px;"></div><div class="big">Loading data…</div><div style="margin-top:6px;">Aapka data load ho raha hai, kuch seconds lagenge.</div></div>`;
    } else if (S.page === 'dashboard') inner = renderDashboard();
    else if (S.page === 'profile') inner = renderProfilePage();
    else if (S.page === 'appearance') inner = renderAppearancePage();
    else if (S.page === 'entryEquity') inner = renderEntry('equity');
    else if (S.page === 'entryCommodity') inner = renderEntry('commodity');
    else if (S.page === 'reportEquity') inner = renderReport('equity');
    else if (S.page === 'reportCommodity') inner = renderReport('commodity');
    else if (S.page === 'itDetails') inner = renderITDetails();
    else if (S.page === 'backoffice') inner = renderBackoffice();
    else if (S.page === 'marginEntry') inner = renderMarginEntry();
    else if (TABLE_DEFS[S.page]) inner = renderDataTable(S.page);
    else
      inner = `<div class="empty-state"><div class="big">Select a page</div>Left mein <b>MARGIN</b> pe click karke apna page choose karein.</div>`;
    // Only the CONTENT changes on most interactions (e.g. a dropdown pick). The
    // shell — sidebar + topbar (live clock, font/theme controls) — is expensive
    // to rebuild and visibly flickers (the clock resets to --:--:--). So compute
    // a signature of everything the shell depends on; if it's unchanged and the
    // shell already exists, swap just the .content and leave the shell (and its
    // ticking clock) alone.
    const shellSig = [
      S.user.id,
      S.user.name,
      S.page,
      [...S.sidebarOpenSections].sort().join(','),
      S.darkMode ? 1 : 0,
      S.syncing ? 1 : 0,
      S.dataReady ? 1 : 0,
      S.profileMenuOpen ? 1 : 0,
      S.showLogoutConfirm ? 1 : 0,
      S.sidebarCollapsed ? 1 : 0,
      S.sidebarDrawerOpen ? 1 : 0,
      S.toast ? S.toast.msg + '|' + (S.toast.isErr ? 1 : 0) : '',
      allNavItems()
        .map((n) => (S.user[n.perm] ? 1 : 0))
        .join(''),
    ].join('~');
    const contentEl = document.querySelector('.content');
    if (contentEl && app.__shellSig === shellSig) {
      contentEl.innerHTML = inner; // shell untouched → no topbar/clock flicker
    } else {
      app.innerHTML = renderShell(inner);
      app.__shellSig = shellSig;
    }
    // Restore scroll positions after re-render
    const rptScroll2 = document.querySelector('.rpt-scroll');
    const dtScroll2 = document.querySelector('.dt-scroll');
    if (rptScroll2) {
      rptScroll2.scrollLeft = savedRptScrollLeft;
      rptScroll2.scrollTop = savedRptScrollTop;
    }
    if (dtScroll2) {
      dtScroll2.scrollLeft = savedDtScrollLeft;
      dtScroll2.scrollTop = savedDtScrollTop;
    }
    const itformScroll2 = document.querySelector('.itform-body');
    if (itformScroll2) itformScroll2.scrollTop = savedItformScrollTop;
    // Backoffice / Margin: keep the page + table scroll where they were so opening
    // or changing the table's User-ID filter doesn't jump the view to the top.
    const boPage2 = document.querySelector('.bo-page');
    if (boPage2) boPage2.scrollTop = savedBoPageTop;
    const boWrap2 = document.querySelector('.bo-tablewrap');
    if (boWrap2) {
      boWrap2.scrollLeft = savedBoWrapLeft;
      boWrap2.scrollTop = savedBoWrapTop;
    }
    if (S.page === 'entryEquity' || S.page === 'entryCommodity') initEntryDatePicker();
    if (S.page === 'itDetails' && S.itForm && S.itForm.open) initItDatePicker();
  }

  loadAll();
</script>
