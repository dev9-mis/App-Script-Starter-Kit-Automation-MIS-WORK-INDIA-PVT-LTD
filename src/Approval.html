<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base target="_top" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #faf6f0;
        color: #241a12;
        min-height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 28px 16px;
      }
      .card {
        width: 100%;
        max-width: 760px;
        background: #fff;
        border: 1px solid #ece2d5;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 24px 60px -28px rgba(123, 64, 25, 0.4);
      }
      .head {
        background: linear-gradient(135deg, #7b4019, #ff7d29);
        color: #fff4e8;
        padding: 14px 24px;
      }
      .head .ey { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.85; }
      .head h1 { font-size: 18px; font-weight: 700; margin-top: 3px; }
      .body { padding: 20px 24px; }
      .muted { color: #9c8a76; font-size: 12px; }
      .sec { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #9c8a76; margin: 16px 0 7px; }
      table { width: 100%; border-collapse: collapse; }
      td { padding: 3px 10px; border: 1px solid #ece2d5; font-size: 12px; line-height: 1.2; vertical-align: top; }
      td.l { background: #fff8ea; color: #5a4a3b; width: 44%; font-weight: 700; }
      /* record table = two field/value pairs per row */
      table.rec td { padding: 3px 8px; font-size: 11.5px; }
      table.rec td.l { width: 18%; }
      table.rec td.v { width: 32%; }
      tr.new td.l { background: #fff8d6; color: #7a5a10; font-weight: 700; border-color: #e8cf6a; }
      tr.new td.v { background: #fffdf0; font-weight: 700; border-color: #e8cf6a; }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        margin-top: 22px;
        padding: 13px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #ff9040, #ff7d29);
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .note {
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 10px;
        font-size: 13px;
        line-height: 1.5;
        font-weight: 500;
      }
      .note.ok { background: #e5f5ea; color: #2e7d46; }
      .note.warn { background: #fff8d6; color: #8a6a12; border: 1px solid #e8cf6a; }
      .note.err { background: #fbeae9; color: #c4291c; }
      .center { text-align: center; padding: 30px 10px; color: #9c8a76; }
      .spinner {
        width: 34px; height: 34px; border-radius: 50%;
        border: 3px solid #ece2d5; border-top-color: #ff7d29;
        margin: 0 auto 12px; animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="head">
        <div class="ey">Pageformat System</div>
        <h1>Backoffice Code Approval</h1>
      </div>
      <div class="body" id="body">
        <div class="center"><div class="spinner"></div>Loading…</div>
      </div>
    </div>

    <script>
      var TOKEN = '<?= token ?>';
      var PRELOAD = <?!= preload ?>;

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }
      function row(label, val, isNew) {
        return '<tr class="' + (isNew ? 'new' : '') + '"><td class="l">' + esc(label) + '</td><td class="v">' + (esc(val) || '—') + '</td></tr>';
      }
      // Full record as a compact TWO-column table (4 cells per row).
      function recordTable(fields) {
        if (!fields || !fields.length) return '';
        var rows = '';
        for (var i = 0; i < fields.length; i += 2) {
          var a = fields[i], b = fields[i + 1];
          rows += '<tr>' +
            '<td class="l">' + esc(a.label) + '</td><td class="v">' + (esc(a.value) || '—') + '</td>' +
            (b ? '<td class="l">' + esc(b.label) + '</td><td class="v">' + (esc(b.value) || '—') + '</td>'
               : '<td class="l"></td><td class="v"></td>') +
            '</tr>';
        }
        return '<div class="sec">Record</div><table class="rec">' + rows + '</table>';
      }
      function render(d) {
        var b = document.getElementById('body');
        if (!d || !d.ok) {
          b.innerHTML = '<div class="note err">' + esc((d && d.message) || 'Could not load this request.') + '</div>';
          return;
        }
        var html =
          '<p class="muted">Review the change for <b style="color:#241a12">' + esc(d.uniqueNo) + '</b> · ' + esc(d.userId) + (d.userName ? ' · ' + esc(d.userName) : '') + '</p>' +
          recordTable(d.fields) +
          '<div class="sec">Change</div><table>' +
          row('Submitted at', d.submittedAt) +
          row('Old Back Office Code', d.oldCode) +
          row('Old Remark', d.oldRemark) +
          row('New Back Office Code', d.newCode, true) +
          row('New Remark', d.newRemark, true) +
          '</table>';
        if (d.approved) {
          html += '<div class="note warn">This data was already approved at <b>' + esc(d.approvedAt) + '</b>.</div>';
        } else {
          html += '<button class="btn" id="approveBtn" onclick="doApprove()">✓ Approve this change</button>';
        }
        b.innerHTML = html;
      }
      function doApprove() {
        var btn = document.getElementById('approveBtn');
        if (btn) { btn.disabled = true; btn.textContent = 'Approving…'; }
        google.script.run
          .withSuccessHandler(function (res) {
            var b = document.getElementById('body');
            if (res && res.status === 'ok') {
              b.innerHTML = '<div class="note ok">✓ Approved successfully at <b>' + esc(res.approvedAt) + '</b>.<br>Back Office Code <b>' + esc(res.newCode) + '</b> is now approved for ' + esc(res.uniqueNo) + '.</div>';
            } else if (res && res.status === 'already') {
              b.innerHTML = '<div class="note warn">' + esc(res.message) + '</div>';
            } else {
              b.innerHTML = '<div class="note err">' + esc((res && res.message) || 'Approval failed.') + '</div>';
            }
          })
          .withFailureHandler(function (err) {
            document.getElementById('body').innerHTML = '<div class="note err">' + esc(err.message || String(err)) + '</div>';
          })
          .approveBackofficeCode(TOKEN);
      }

      // Render instantly from the server-injected preload; only fall back to a
      // round trip if it wasn't provided.
      if (PRELOAD && typeof PRELOAD === 'object') {
        render(PRELOAD);
      } else {
        google.script.run
          .withSuccessHandler(render)
          .withFailureHandler(function (err) {
            document.getElementById('body').innerHTML = '<div class="note err">' + esc(err.message || String(err)) + '</div>';
          })
          .getApprovalDetails(TOKEN);
      }
    </script>
  </body>
</html>
